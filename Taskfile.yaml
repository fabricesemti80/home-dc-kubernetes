---
version: '3'

set: [pipefail]
shopt: [globstar]

vars:
  BOOTSTRAP_DIR: '{{.ROOT_DIR}}/bootstrap'
  KUBERNETES_DIR: '{{.ROOT_DIR}}/kubernetes'
  SCRIPTS_DIR: '{{.ROOT_DIR}}/scripts'
  TALOS_DIR: '{{.ROOT_DIR}}/talos/app'
  PRIVATE_DIR: '{{.ROOT_DIR}}/.private'
  TALOSCONFIG: '{{.ROOT_DIR}}/talos/app/clusterconfig/talosconfig'

env:
  KUBECONFIG: '{{.ROOT_DIR}}/kubeconfig'
  SOPS_AGE_KEY_FILE: '{{.ROOT_DIR}}/age.key'
  TALOSCONFIG: '{{.TALOSCONFIG}}'

includes:
  backups: .taskfiles/backup
  bootstrap: .taskfiles/bootstrap
  clusters: .taskfiles/clusters
  infrastructure: .taskfiles/infrastructure
  secrets: .taskfiles/secrets
  talos: .taskfiles/talos
  template: .taskfiles/template

tasks:

  default: task --list

  validate:
    desc: Validate repository structure and generated files
    cmds:
      - bash {{.ROOT_DIR}}/scripts/validate.sh
      - python3 {{.ROOT_DIR}}/scripts/generate-autokuma-monitors.py --check

  arc:repair-stale-listener:
    desc: Re-register an ARC scale set after GitHub returns RunnerScaleSetNotFoundException
    requires:
      vars: [STALE_ID]
    cmd: bash {{.ROOT_DIR}}/scripts/repair-arc-stale-listener.sh "{{.STALE_ID}}"

  monitoring:generate-autokuma:
    desc: Manually regenerate AutoKuma monitors (normally handled by GitHub Actions)
    cmd: python3 {{.ROOT_DIR}}/scripts/generate-autokuma-monitors.py

  monitoring:check-autokuma:
    desc: Check generated AutoKuma monitor inventory for drift
    cmd: python3 {{.ROOT_DIR}}/scripts/generate-autokuma-monitors.py --check

  deps:
    desc: Install Helm dependencies for the cluster workflow
    cmds:
      - helm plugin list | grep -q 'secrets' || helm plugin install https://github.com/jkroepke/helm-secrets --verify=false
      - helm plugin list | grep -q 'diff' || helm plugin install https://github.com/databus23/helm-diff --verify=false
    preconditions:
      - which helm

  lint:
    desc: Run linters manually with auto-fixing where possible
    cmds:
      - shfmt -w -i 2 -s {{.ROOT_DIR}}/scripts/*.sh {{.ROOT_DIR}}/scripts/lib/*.sh
      - yamllint {{.ROOT_DIR}}
      - shellcheck {{.ROOT_DIR}}/scripts/*.sh {{.ROOT_DIR}}/scripts/lib/*.sh
    preconditions:
      - which shfmt yamllint shellcheck

  pre-commit:install:
    desc: Install pre-commit git hooks
    cmd: pre-commit install
    preconditions:
      - which pre-commit

  pre-commit:run:
    desc: Run all pre-commit hooks against all files
    cmd: pre-commit run --all-files
    preconditions:
      - which pre-commit

  talos:genconfig:
    desc: Generate Talos machine configuration
    cmd: task talos:generate-config

  talos:bootstrap:
    desc: Bootstrap Talos cluster and join nodes
    cmd: task bootstrap:talos

  talos:reboot-nodes:
    desc: Reboot Talos nodes one at a time and wait for Ready
    cmd: bash hack/reboot-talos-nodes-sequentially.sh {{.CLI_ARGS}}
    preconditions:
      - test -f hack/reboot-talos-nodes-sequentially.sh
      - test -f kubeconfig
      - which kubectl
      - which talosctl

  apps:bootstrap:
    desc: Bootstrap cluster apps after Talos is healthy
    cmd: task bootstrap:apps

  sync-argo-bootstrap:
    desc: Apply the Argo CD app-of-apps bootstrap resources
    cmd: task infrastructure:argo-sync-bootstrap

  reconcile:
    desc: Request an immediate Argo CD refresh of all applications
    cmd: task infrastructure:argo-reconcile

  platform:cilium:
    desc: Install and validate Cilium
    cmd: task infrastructure:platform-cilium

  platform:ingress:
    desc: Validate the Envoy Gateway ingress path
    cmd: task infrastructure:platform-ingress

  platform:argocd:
    desc: Install and validate Argo CD
    cmd: task infrastructure:platform-argocd

  platform:observability:
    desc: Install observability stack
    cmd: task infrastructure:platform-observability

  verify:cluster:
    desc: Run post-bootstrap verification checks
    cmd: task infrastructure:verify


  cluster:sync-argo:
    desc: Apply the Argo bootstrap resources from this repo
    cmd: task infrastructure:argo-sync-bootstrap

  cluster:reconcile:
    desc: Request an immediate Argo CD refresh of all applications
    cmd: task infrastructure:argo-reconcile
