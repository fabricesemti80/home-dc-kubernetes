# Global patches

# Dedicated data disks on each worker, never the Talos system disk.
# Disks are told apart by size so the two volumes can never claim each other's disk:
#   - local-path-provisioner: the 100 GiB Proxmox data disk (scsi1).
#   - longhorn: the ~465 GiB raw SATA SSD passed through from pve-00 (scsi2).
worker:
  userVolumes:
    - name: local-path-provisioner
      provisioning:
        diskSelector:
          match: "!system_disk && disk.size < 200u * GiB"
        minSize: 80GiB
        maxSize: 90GiB
    - name: longhorn
      provisioning:
        diskSelector:
          match: "!system_disk && disk.size > 400u * GiB"
        minSize: 400GiB
        grow: true
  patches:
    - "@./patches/worker/machine-longhorn.yaml"
patches:
  - "@./patches/global/machine-files.yaml"
  - "@./patches/global/machine-kubelet.yaml"
  - "@./patches/global/machine-network.yaml"
  - "@./patches/global/machine-registries.sops.yaml"
  - "@./patches/global/machine-sysctls.yaml"
  - "@./patches/global/machine-time.yaml"

# Controller patches
controlPlane:
  patches:
    - "@./patches/controller/cluster.yaml"
