---
apiVersion: v1
kind: Namespace
metadata:
  name: kestra
  labels:
    # Kestra uses Docker-in-Docker in insecure mode, which requires privileged
    # containers. Baseline would reject it, so enforce privileged here.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
