---
# Pin all Kestra pods to the infra control node so local-path volumes stay
# on the same node.
fullnameOverride: kestra

common:
  nodeSelector:
    kubernetes.io/hostname: infra-cp-01
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  affinity: {}
  podSecurityContext:
    supplementalGroups:
      - 2375
  extraEnvFrom:
    - secretRef:
        name: kestra-basic-auth
    - secretRef:
        name: kestra-postgres
    - secretRef:
        name: versitygw-root
    - secretRef:
        name: kestra-homelab-ops
  extraEnv:
    - name: DOCKER_HOST
      value: unix:///dind/docker.sock
  initContainers:
    - name: ensure-kestra-bucket
      image: amazon/aws-cli:2.36.14
      command:
        - sh
        - -lc
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: versitygw-root
              key: ROOT_ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: versitygw-root
              key: ROOT_SECRET_KEY
        - name: AWS_DEFAULT_REGION
          value: eu-west-1
        - name: S3_ENDPOINT_URL
          value: http://versitygw:7070
        - name: BUCKET
          value: kestra
      args:
        - |
          set -euo pipefail
          for i in $(seq 1 60); do
            aws --endpoint-url "$S3_ENDPOINT_URL" s3api list-buckets >/dev/null 2>&1 && break
            sleep 2
          done
          aws --endpoint-url "$S3_ENDPOINT_URL" s3api head-bucket --bucket "$BUCKET" >/dev/null 2>&1 \
            || aws --endpoint-url "$S3_ENDPOINT_URL" s3 mb "s3://$BUCKET"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

  # Kestra is a Java app that runs flows + scheduler + executor in standalone
  # mode. Sizing for infra-cp-01 (5.95 CPU / 15.5Gi): keep requests modest but
  # give the JVM headroom; limits bound the node alongside NetBox.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

dind:
  enabled: true
  mode: insecure
  # Docker-in-Docker builds flow containers; can spike CPU during image pulls.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

configurations:
  application:
    kestra:
      tutorialFlows:
        enabled: false
      server:
        basic-auth:
          enabled: true
          username: ${KESTRA_BASIC_AUTH_USERNAME}
          password: ${KESTRA_BASIC_AUTH_PASSWORD}
      queue:
        type: postgres
      repository:
        type: postgres
      storage:
        type: s3
        s3:
          endpoint: "http://versitygw:7070"
          region: "eu-west-1"
          bucket: "kestra"
          access-key: ${ROOT_ACCESS_KEY}
          secret-key: ${ROOT_SECRET_KEY}
          force-path-style: true
    datasources:
      postgres:
        url: "jdbc:postgresql://kestra-postgres:5432/kestra"
        driverClassName: org.postgresql.Driver
        username: ${USERDB_USER}
        password: ${USERDB_PASSWORD}
