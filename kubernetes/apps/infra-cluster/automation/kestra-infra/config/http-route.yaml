---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kestra-internal
  namespace: kestra
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: http
  hostnames:
    - kestra.krapulax.home
  rules:
    - backendRefs:
        - name: kestra
          namespace: kestra
          port: 8080
