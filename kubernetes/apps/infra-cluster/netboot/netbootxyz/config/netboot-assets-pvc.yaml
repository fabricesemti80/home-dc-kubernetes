---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netboot-assets-pvc
  namespace: netboot
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: ""
  volumeName: netboot-assets-pv
