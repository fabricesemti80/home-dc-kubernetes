---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: tailscale-operator-oauth
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  tokenSecret:
    name: doppler-token-secret-infra
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: infra
  managedSecret:
    name: operator-oauth
    namespace: tailscale
    type: Opaque
  secrets:
    - TAILSCALE_OAUTH_CLIENT_ID
    - TAILSCALE_OAUTH_CLIENT_SECRET
  processors:
    TAILSCALE_OAUTH_CLIENT_ID:
      type: plain
      asName: client_id
    TAILSCALE_OAUTH_CLIENT_SECRET:
      type: plain
      asName: client_secret
