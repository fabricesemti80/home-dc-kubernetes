---
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: infra-router
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 2
  hostnamePrefix: infra-router
  proxyClass: infra-router
  subnetRouter:
    advertiseRoutes:
      - 10.0.0.0/16
      - 192.168.0.0/16
  exitNode: true
