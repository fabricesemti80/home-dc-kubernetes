---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8s-backup-infra
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
  claimRef:
    namespace: backups
    name: k8s-backup
  nfs:
    server: 10.0.40.2
    path: /k8s-backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8s-backup
  namespace: backups
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: k8s-backup-infra
  resources:
    requests:
      storage: 1Ti
