---
# protect: false on an app opts it out (default: protected).
cluster: infra-cluster
apps:
- name: technitium-0
  namespace: network
  node: infra-cp-01
  claim: config-technitium-0
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  schedule: 0 1 * * *
# Retired 2026-11-04: the unmanaged second node was removed. Its PV is retained and
# unused; existing snapshots are kept for rollback.
- name: technitium-1
  namespace: network
  protect: false
- name: autokuma
  namespace: monitoring
  node: infra-wk-01
  hostPath: /var/autokuma/data
  schedule: 15 1 * * *
- name: victoriametrics-metrics
  namespace: monitoring
  protect: false
- name: pve-exporter
  namespace: monitoring
  protect: false
- name: pbs-exporter
  namespace: monitoring
  protect: false
- name: remote-write-proxy
  namespace: monitoring
  protect: false
- name: smartctl-exporter
  namespace: monitoring
  protect: false
