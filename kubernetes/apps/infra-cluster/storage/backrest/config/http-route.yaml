---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backrest
  namespace: backups
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: http
  hostnames:
  - backrest-infra.krapulax.home
  rules:
  - backendRefs:
    - name: backrest
      port: 9898
