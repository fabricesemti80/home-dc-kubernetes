---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backrest
  namespace: backups
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Backrest infra
    gethomepage.dev/group: infra-cluster
    gethomepage.dev/icon: backrest.png
    gethomepage.dev/description: Encrypted backups and restores
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: http
  hostnames:
  - backrest-infra.krapulax.home
  rules:
  - backendRefs:
    - name: backrest
      port: 9898
