---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: backrest-infra
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-infra
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: infra
  managedSecret:
    name: backrest-secrets
    namespace: backups
    type: Opaque
  secrets:
  - BACKREST_REPOSITORY_PASSWORD
  - BACKREST_ADMIN_PASSWORD_BCRYPT
  - SLACK_WEBHOOK_MONITORING
  - LITELLM_BACKUP_PASSWORD
  - LITELLM_POSTGRES_DB
  - LITELLM_POSTGRES_USER
  - LITELLM_POSTGRES_PASSWORD
  - LITELLM_USERDB_PASSWORD
  - LITELLM_MASTER_KEY
  - LITELLM_SALT_KEY
  - AI_OPENAI_API_KEY
  - AI_OPENROUTER_API_KEY
