---
global:
  createDefaultServiceAccount: false

controllers:
  uptime-kuma:
    replicas: 1
    strategy: Recreate
    initContainers:
      fix-perms:
        image:
          repository: docker.io/library/busybox
          tag: "1.38"
        command:
          - /bin/sh
          - -c
        args:
          - chown -R 1000:1000 /app/data
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
    containers:
      app:
        image:
          repository: docker.io/louislam/uptime-kuma
          tag: "2.5.0"
        env:
          TZ: Europe/London
          UPTIME_KUMA_PORT: &port 3001
          DATA_DIR: /app/data
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: *port
              initialDelaySeconds: 30
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 6
          readiness: *probes
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: *port
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi

  autokuma:
    replicas: 1
    strategy: Recreate
    initContainers:
      fix-perms:
        image:
          repository: docker.io/library/busybox
          tag: "1.38"
        command:
          - /bin/sh
          - -c
        args:
          - chown -R 1000:1000 /data
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
    containers:
      app:
        image:
          repository: ghcr.io/bigboot/autokuma
          tag: "2.0.0"
        env:
          TZ: Europe/London
          AUTOKUMA__KUMA__URL: http://uptime-kuma.monitoring.svc.cluster.local:3001
          AUTOKUMA__KUMA__USERNAME:
            valueFrom:
              secretKeyRef:
                name: uptime-kuma-credentials
                key: UPTIME_KUMA_USERNAME
          AUTOKUMA__KUMA__PASSWORD:
            valueFrom:
              secretKeyRef:
                name: uptime-kuma-credentials
                key: UPTIME_KUMA_PASSWORD
          AUTOKUMA__DOCKER__ENABLED: "false"
          AUTOKUMA__KUBERNETES__ENABLED: "false"
          AUTOKUMA__STATIC_MONITORS: /config/monitors
          AUTOKUMA__FILES__FOLLOW_SYMLINKS: "true"
          AUTOKUMA__ON_DELETE: delete
          AUTOKUMA__TAG_NAME: AutoKuma
          AUTOKUMA__TAG_COLOR: "#42C0FB"
          AUTOKUMA__DEFAULT_SETTINGS: |-
            *.interval: 60
            *.max_retries: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi

defaultPodOptions:
  automountServiceAccountToken: false
  annotations:
    reloader.stakater.com/auto: "true"
  nodeSelector:
    kubernetes.io/hostname: infra-wk-01
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

service:
  app:
    controller: uptime-kuma
    ports:
      http:
        port: 3001

persistence:
  data:
    type: custom
    volumeSpec:
      hostPath:
        path: /var/uptime-kuma/data
        type: DirectoryOrCreate
    advancedMounts:
      uptime-kuma:
        fix-perms:
          - path: /app/data
        app:
          - path: /app/data
  autokuma-data:
    type: custom
    volumeSpec:
      hostPath:
        path: /var/autokuma/data
        type: DirectoryOrCreate
    advancedMounts:
      autokuma:
        fix-perms:
          - path: /data
        app:
          - path: /data
  monitors:
    type: configMap
    name: autokuma-monitors
    advancedMounts:
      autokuma:
        app:
          - path: /config/monitors
            readOnly: true
  tmp:
    type: emptyDir
    advancedMounts:
      uptime-kuma:
        app:
          - path: /tmp
      autokuma:
        app:
          - path: /tmp
