---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: pve-exporter
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-infra
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: infra
  managedSecret:
    name: pve-exporter-credentials
    namespace: monitoring
    type: Opaque
  secrets:
    - PVE_MONITORING_TOKEN_SECRET
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: pve-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      monitoring.krapulax.home/target: pve-exporter
  endpoints:
    - port: http
      path: /pve
      interval: 60s
      scrapeTimeout: 45s
      params:
        target: ['10.0.40.10']
        cluster: ['1']
        node: ['1']
