---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: pve-hardware-client-tls
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-infra
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: infra
  managedSecret:
    name: pve-hardware-client-tls
    namespace: monitoring
    type: Opaque
  secrets:
    - MONITORING_HW_CA_CERT
    - MONITORING_HW_CLIENT_CERT
    - MONITORING_HW_CLIENT_KEY
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: pve-host-hardware
  namespace: monitoring
spec:
  jobName: pve-host-hardware
  targetEndpoints:
    - targets: ['10.0.40.10:9100']
      scheme: https
      interval: 60s
      scrapeTimeout: 15s
      tlsConfig:
        ca:
          secret:
            name: pve-hardware-client-tls
            key: MONITORING_HW_CA_CERT
        cert:
          secret:
            name: pve-hardware-client-tls
            key: MONITORING_HW_CLIENT_CERT
        keySecret:
          name: pve-hardware-client-tls
          key: MONITORING_HW_CLIENT_KEY
        insecureSkipVerify: false
