---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./config/doppler.yaml
  - ./config/http-route.yaml
  - ./config/rules.yaml
  - ./config/dashboard.yaml
  - ./config/kiosk-dashboard.yaml
  - ./config/nfs-exporter.yaml
configMapGenerator:
  - name: grafana-k8s-dashboard-15661
    namespace: monitoring
    files:
      - k8s-dashboard-15661.json=./config/dashboards/k8s-dashboard-15661.json
    options:
      disableNameSuffixHash: true
      annotations:
        grafana_folder: Kubernetes
      labels:
        grafana_dashboard: '1'
