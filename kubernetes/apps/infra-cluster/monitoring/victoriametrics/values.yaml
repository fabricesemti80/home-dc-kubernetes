---
victoria-metrics-operator:
  crds:
    cleanup:
      enabled: false
  operator:
    disable_prometheus_converter: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
# Talos serves node-specific kubelet certificates that are not trusted by the
# cluster API CA. Do not bypass certificate verification.
kubelet:
  enabled: false
  vmScrapes:
    cadvisor:
      enabled: false
    probes:
      enabled: false
    resources:
      enabled: false
  vmScrape:
    spec:
      tlsConfig:
        insecureSkipVerify: false

# Talos binds this endpoint to loopback; the chart Service cannot reach it.
kubeControllerManager:
  enabled: false

# Do not fetch mutable dashboards and rules from upstream during reconciliation.
syncJob:
  enabled: false
defaultDashboards:
  enabled: false
defaultRules:
  create: false

prometheus-node-exporter:
  extraArgs:
    - '--collector.filesystem.mount-points-include=^(/|/var|/var/mnt/local-path-provisioner)$'
    - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$'
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      memory: 128Mi
kube-state-metrics:
  resources:
    requests:
      cpu: 30m
      memory: 96Mi
    limits:
      memory: 256Mi
vmalert:
  spec:
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        memory: 256Mi

vmagent:
  rbac:
    namespaced: false
  spec:
    scrapeInterval: 30s
    externalLabels:
      cluster: infra-cluster
      environment: lab
    remoteWriteSettings:
      label:
        cluster: infra-cluster
        environment: lab
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi

vmsingle:
  spec:
    retentionPeriod: 30d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    storage:
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi

alertmanager:
  name: alerts
  spec:
    secrets:
      - monitoring-alertmanager
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
  config:
    route:
      receiver: slack-monitoring
      group_by: [cluster, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
    inhibit_rules:
      - source_matchers:
          - alertname="ProxmoxHostUnavailable"
        target_matchers:
          - alertname=~"Proxmox(HardwareMetricsUnavailable|DiskSmartUnavailable|DiskUnhealthy|ZfsPoolUnhealthy|DiskHot|StorageAlmostFull|HostExporterUnavailable|CpuTemperatureHigh|HostExporterCertificateExpiring)"
      - source_matchers:
          - alertname="ProxmoxBackupServerUnavailable"
        target_matchers:
          - alertname=~"Proxmox(Backup(TaskFailed|TaskMetricsUnavailable|TaskHistoryTruncated|DatastoreAlmostFull)|WeeklyGuestBackupStale|MonthlyPbsGuestBackupStale|LatestSnapshotsNotVerified)"
    receivers:
      - name: slack-monitoring
        slack_configs:
          - api_url_file: /etc/vm/secrets/monitoring-alertmanager/SLACK_WEBHOOK_MONITORING
            send_resolved: true

grafana:
  admin:
    existingSecret: monitoring-grafana
    userKey: GRAFANA_ADMIN_USER
    passwordKey: GRAFANA_ADMIN_PASSWORD
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
  grafana.ini:
    server:
      root_url: http://grafana.krapulax.home/
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
