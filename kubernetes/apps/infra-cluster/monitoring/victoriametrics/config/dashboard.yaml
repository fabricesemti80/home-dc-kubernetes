---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-infrastructure-overview
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  infrastructure-overview.json: |
    {
      "uid": "infrastructure-overview",
      "title": "Infrastructure overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Ready Kubernetes nodes",
          "gridPos": {"h": 5, "w": 8, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"expr": "sum by (cluster) (kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "legendFormat": "{{cluster}}", "refId": "A"}]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pending persistent volume claims",
          "gridPos": {"h": 5, "w": 8, "x": 8, "y": 0},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"expr": "sum by (cluster) (kube_persistentvolumeclaim_status_phase{phase=\"Pending\"})", "legendFormat": "{{cluster}}", "refId": "A"}]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Unavailable deployments",
          "gridPos": {"h": 5, "w": 8, "x": 16, "y": 0},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"expr": "sum by (cluster) (kube_deployment_status_replicas_unavailable)", "legendFormat": "{{cluster}}", "refId": "A"}]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Node and local-path filesystem free space",
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 5},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "percentunit"}},
          "targets": [{"expr": "node_filesystem_avail_bytes{mountpoint=~\"/|/var|/var/mnt/local-path-provisioner\",fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{mountpoint=~\"/|/var|/var/mnt/local-path-provisioner\",fstype!~\"tmpfs|overlay|squashfs\"}", "legendFormat": "{{cluster}} / {{instance}} / {{mountpoint}}", "refId": "A"}]
        },
        {
          "id": 5,
          "type": "gauge",
          "title": "NAS media and backup free space",
          "gridPos": {"h": 7, "w": 12, "x": 0, "y": 14},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
          "targets": [{"expr": "node_filesystem_avail_bytes{job=\"nas-filesystems\"} / node_filesystem_size_bytes{job=\"nas-filesystems\"}", "legendFormat": "{{device}}", "refId": "A"}]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Kubernetes node CPU utilization",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 21},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
          "targets": [{"expr": "1 - avg by (cluster, instance) (rate(node_cpu_seconds_total{mode=\"idle\",job!=\"pve-host-hardware\"}[5m]))", "legendFormat": "{{cluster}} / {{instance}}", "refId": "A"}]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Kubernetes node memory utilization",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 21},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
          "targets": [{"expr": "1 - (node_memory_MemAvailable_bytes{job!=\"pve-host-hardware\"} / node_memory_MemTotal_bytes{job!=\"pve-host-hardware\"})", "legendFormat": "{{cluster}} / {{instance}}", "refId": "A"}]
        }
      ]
    }
