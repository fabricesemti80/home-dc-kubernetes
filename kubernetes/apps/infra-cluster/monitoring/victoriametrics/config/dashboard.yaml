---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-infrastructure-overview
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  infrastructure-overview.json: |
    {
      "uid": "infrastructure-overview",
      "title": "Infrastructure overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Ready Kubernetes nodes",
          "gridPos": {"h": 5, "w": 8, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "refId": "A"}]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pending persistent volume claims",
          "gridPos": {"h": 5, "w": 8, "x": 8, "y": 0},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"expr": "sum(kube_persistentvolumeclaim_status_phase{phase=\"Pending\"})", "refId": "A"}]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Unavailable deployments",
          "gridPos": {"h": 5, "w": 8, "x": 16, "y": 0},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"expr": "sum(kube_deployment_status_replicas_unavailable)", "refId": "A"}]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Node root filesystem free space",
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 5},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "percentunit"}},
          "targets": [{"expr": "node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay|squashfs\"}", "legendFormat": "{{instance}}", "refId": "A"}]
        }
      ]
    }
