---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: monitoring-alertmanager
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-infra
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: infra
  managedSecret:
    name: monitoring-alertmanager
    namespace: monitoring
    type: Opaque
  secrets:
    - SLACK_WEBHOOK_MONITORING
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: monitoring-grafana
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-infra
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: infra
  managedSecret:
    name: monitoring-grafana
    namespace: monitoring
    type: Opaque
  secrets:
    - GRAFANA_ADMIN_USER
    - GRAFANA_ADMIN_PASSWORD
