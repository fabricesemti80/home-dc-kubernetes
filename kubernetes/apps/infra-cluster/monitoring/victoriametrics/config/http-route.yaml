---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: http
  hostnames:
    - grafana.krapulax.home
  rules:
    - backendRefs:
        - name: victoriametrics-grafana
          port: 80
---
# Read-only UI/query access. VMUI POSTs long queries, so only exact read-only
# query endpoints accept POST; writes, deletes, snapshots and other
# management endpoints are intentionally not routable from the LAN.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoriametrics
  namespace: monitoring
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: http
  hostnames:
    - victoriametrics.krapulax.home
  rules:
    - matches:
        - path: {type: Exact, value: /}
          method: GET
        - path: {type: PathPrefix, value: /vmui}
          method: GET
        - path: {type: PathPrefix, value: /prometheus}
          method: GET
        - path: {type: PathPrefix, value: /api/v1}
          method: GET
        - path: {type: PathPrefix, value: /targets}
          method: GET
        - path: {type: Exact, value: /prettify-query}
          method: GET
        - path: {type: Exact, value: /expand-with-exprs}
          method: GET
        - path: {type: Exact, value: /api/v1/query}
          method: POST
        - path: {type: Exact, value: /api/v1/query_range}
          method: POST
        - path: {type: Exact, value: /api/v1/series}
          method: POST
        - path: {type: Exact, value: /api/v1/labels}
          method: POST
        - path: {type: Exact, value: /prometheus/api/v1/query}
          method: POST
        - path: {type: Exact, value: /prometheus/api/v1/query_range}
          method: POST
        - path: {type: Exact, value: /prometheus/api/v1/series}
          method: POST
        - path: {type: Exact, value: /prometheus/api/v1/labels}
          method: POST
      backendRefs:
        - name: vmsingle-victoriametrics-victoria-metrics-k8s-stack
          port: 8428
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: http
  hostnames:
    - alertmanager.krapulax.home
  rules:
    - backendRefs:
        - name: vmalertmanager-alerts
          port: 9093
