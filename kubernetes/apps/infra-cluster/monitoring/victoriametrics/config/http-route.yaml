---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: http
  hostnames:
    - grafana.krapulax.home
  rules:
    - backendRefs:
        - name: victoriametrics-grafana
          port: 80
