---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: http
  hostnames:
    - grafana.krapulax.home
  rules:
    - backendRefs:
        - name: victoriametrics-grafana
          port: 80
---
# Read-only UI/query access. Only exact read-only endpoints are routable:
# VictoriaMetrics dispatches some write routes (for example
# /api/v1/import/prometheus) without checking the HTTP method, so GET must
# never be allowed on whole API prefixes. VMUI POSTs long queries, hence POST
# is allowed only on the exact query endpoints. Remote write, import, delete,
# snapshot and internal management endpoints are not routable from the LAN.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoriametrics
  namespace: monitoring
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: http
  hostnames:
    - victoriametrics.krapulax.home
  rules:
    - matches:
        - path: {type: Exact, value: /}
          method: GET
        - path: {type: PathPrefix, value: /vmui}
          method: GET
        - path: {type: Exact, value: /prettify-query}
          method: GET
        - path: {type: Exact, value: /expand-with-exprs}
          method: GET
        - path: {type: Exact, value: /api/v1/query}
          method: GET
        - path: {type: Exact, value: /api/v1/query_range}
          method: GET
        - path: {type: Exact, value: /api/v1/series}
          method: GET
        - path: {type: Exact, value: /api/v1/labels}
          method: GET
        - path: {type: RegularExpression, value: '^/(prometheus/)?api/v1/label/[^/]+/values$'}
          method: GET
        - path: {type: Exact, value: /api/v1/status/tsdb}
          method: GET
        - path: {type: Exact, value: /api/v1/status/top_queries}
          method: GET
        - path: {type: Exact, value: /api/v1/status/active_queries}
          method: GET
        - path: {type: Exact, value: /api/v1/status/buildinfo}
          method: GET
        - path: {type: Exact, value: /api/v1/metadata}
          method: GET
        - path: {type: Exact, value: /prometheus/api/v1/query}
          method: GET
        - path: {type: Exact, value: /prometheus/api/v1/query_range}
          method: GET
        - path: {type: Exact, value: /prometheus/api/v1/series}
          method: GET
        - path: {type: Exact, value: /prometheus/api/v1/labels}
          method: GET
        - path: {type: Exact, value: /prometheus/api/v1/status/tsdb}
          method: GET
        - path: {type: Exact, value: /prometheus/api/v1/status/top_queries}
          method: GET
        - path: {type: Exact, value: /prometheus/api/v1/status/active_queries}
          method: GET
        - path: {type: Exact, value: /prometheus/api/v1/status/buildinfo}
          method: GET
        - path: {type: Exact, value: /prometheus/api/v1/metadata}
          method: GET
        - path: {type: Exact, value: /api/v1/query}
          method: POST
        - path: {type: Exact, value: /api/v1/query_range}
          method: POST
        - path: {type: Exact, value: /api/v1/series}
          method: POST
        - path: {type: Exact, value: /api/v1/labels}
          method: POST
        - path: {type: Exact, value: /prometheus/api/v1/query}
          method: POST
        - path: {type: Exact, value: /prometheus/api/v1/query_range}
          method: POST
        - path: {type: Exact, value: /prometheus/api/v1/series}
          method: POST
        - path: {type: Exact, value: /prometheus/api/v1/labels}
          method: POST
      backendRefs:
        - name: vmsingle-victoriametrics-victoria-metrics-k8s-stack
          port: 8428
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: http
  hostnames:
    - alertmanager.krapulax.home
  rules:
    - backendRefs:
        - name: vmalertmanager-alerts
          port: 9093
