---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nas-filesystems
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nas-filesystems
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nas-filesystems
    spec:
      automountServiceAccountToken: false
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.12.1
          args:
            - --collector.disable-defaults
            - --collector.filesystem
            - '--collector.filesystem.mount-points-include=^/(media|backup)$'
          ports:
            - name: metrics
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /
              port: metrics
          livenessProbe:
            httpGet:
              path: /
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: media
              mountPath: /media
              readOnly: true
            - name: backup
              mountPath: /backup
              readOnly: true
      volumes:
        - name: media
          nfs:
            server: 10.0.40.2
            path: /media
            readOnly: true
        - name: backup
          nfs:
            server: 10.0.40.2
            path: /k8s-backup
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: nas-filesystems
  namespace: monitoring
  labels:
    app.kubernetes.io/name: nas-filesystems
spec:
  selector:
    app.kubernetes.io/name: nas-filesystems
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: nas-filesystems
  namespace: monitoring
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: nas-filesystems
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 15s
