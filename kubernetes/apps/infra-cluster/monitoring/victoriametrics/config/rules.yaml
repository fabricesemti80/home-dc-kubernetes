---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: infrastructure-health
  namespace: monitoring
spec:
  groups:
    - name: infrastructure-health
      rules:
        - alert: KubernetesNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes node {{ $labels.node }} is not Ready
            description: The node has been NotReady for at least five minutes.
        - alert: KubernetesNodeResourcePressure
          expr: kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes node {{ $labels.node }} reports {{ $labels.condition }}
            description: Inspect node capacity and workloads before pods are evicted or fail to start.
        - alert: PersistentVolumeClaimPending
          expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: PersistentVolumeClaim {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is pending
            description: The claim has remained Pending for at least 15 minutes.
        - alert: AppConfigExportStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time{cronjob=~"protect-.*"} > 36 * 3600)
            or ((time() - kube_cronjob_created{cronjob=~"protect-.*"} > 36 * 3600)
              unless on (cluster, namespace, cronjob) kube_cronjob_status_last_successful_time{cronjob=~"protect-.*"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Config export {{ $labels.namespace }}/{{ $labels.cronjob }} is stale
            description: Check app-protect job logs and the NAS. This export check does not verify the subsequent Backrest snapshot.
        - alert: NodeFilesystemAlmostFull
          expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint=~"/|/var|/var/mnt/local-path-provisioner"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint=~"/|/var|/var/mnt/local-path-provisioner"}) < 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Node filesystem {{ $labels.mountpoint }} is almost full on {{ $labels.instance }}
            description: Less than ten percent of filesystem space has been available for 15 minutes.
        - alert: AppClusterTelemetryMissing
          expr: absent(kube_node_info{cluster="app-cluster"})
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: App-cluster Kubernetes telemetry is missing
            description: Check the app cluster, its vmagent and the authenticated remote-write path.
        - alert: KubernetesDeploymentUnavailable
          expr: |
            (kube_deployment_spec_replicas - avg_over_time(kube_deployment_status_replicas_available[15m]))
              / kube_deployment_spec_replicas > 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas
            description: Replicas were unavailable for most of the last 15 minutes. Averaged so a pod that is briefly Ready between crashes does not reset the alert.
        - alert: KubernetesPodCrashLooping
          # VictoriaMetrics increase() counts a newly appeared series' first value
          # as growth, so require the series to have existed 30 minutes ago;
          # otherwise every vmagent restart or relabel fires for pods with old
          # restart counts (observed live: 9 false positives with constant counters).
          expr: |
            (increase(kube_pod_container_status_restarts_total[30m]) > 3)
              and (kube_pod_container_status_restarts_total offset 30m)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Container {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) restarted more than 3 times in 30 minutes
            description: Restart-based rather than state-based, because a crash-looping pod is only in CrashLoopBackOff between runs. Check the last termination reason, for example OOMKilled.
        - alert: KubernetesContainerOOMKilled
          expr: |
            (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
              and on (cluster, namespace, pod, container)
              ((increase(kube_pod_container_status_restarts_total[15m]) > 0)
                and (kube_pod_container_status_restarts_total offset 15m))
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Container {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOMKilled and restarted
            description: Its last termination was OOMKilled within the last 15 minutes. Raise the memory limit or reduce memory use (for example application cache size).
        - alert: CertificateExpiringSoon
          expr: min by (cluster, exported_namespace, name) (certmanager_certificate_expiration_timestamp_seconds - time()) < 86400
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in less than 24 hours
            description: Check cert-manager renewal and DNS or ACME access.
        - alert: NasFilesystemTelemetryUnavailable
          expr: absent(up{job="nas-filesystems"} == 1)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: NAS filesystem telemetry is unavailable
            description: Check the collector pod, NFS mounts and network path; this does not alone prove a NAS outage.
        - alert: NasFilesystemInaccessible
          expr: max(node_filesystem_device_error{job="nas-filesystems"}) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: NAS filesystem capacity cannot be read
            description: Check NFS connectivity and permissions for the monitoring collector.
        - alert: NasFilesystemAlmostFull
          expr: min(node_filesystem_avail_bytes{job="nas-filesystems"} / node_filesystem_size_bytes{job="nas-filesystems"}) < 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: A NAS media or backup filesystem is almost full
            description: Less than ten percent of available filesystem space remains; inspect the NAS capacity dashboard.
