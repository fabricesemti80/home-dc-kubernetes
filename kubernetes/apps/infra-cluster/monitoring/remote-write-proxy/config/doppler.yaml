---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: remote-write-server-tls
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-infra
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: infra
  managedSecret:
    name: remote-write-server-tls
    namespace: monitoring
    type: Opaque
  secrets:
    - MONITORING_REMOTE_CA_CERT
    - MONITORING_REMOTE_SERVER_CERT
    - MONITORING_REMOTE_SERVER_KEY
