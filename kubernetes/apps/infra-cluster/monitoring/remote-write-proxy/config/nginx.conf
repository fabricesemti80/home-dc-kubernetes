pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server {
        listen 8443 ssl;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/monitoring-tls/MONITORING_REMOTE_SERVER_CERT;
        ssl_certificate_key /etc/monitoring-tls/MONITORING_REMOTE_SERVER_KEY;
        ssl_client_certificate /etc/monitoring-tls/MONITORING_REMOTE_CA_CERT;
        ssl_verify_client on;
        client_max_body_size 64m;
        location = /api/v1/write {
            limit_except POST { deny all; }
            proxy_pass http://vmsingle-victoriametrics-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location / { return 404; }
    }
}
