---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: pbs-exporter
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-infra
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: infra
  managedSecret:
    name: pbs-exporter-credentials
    namespace: monitoring
    type: Opaque
  secrets:
    - PBS_MONITORING_TOKEN_SECRET
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: pbs-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      monitoring.krapulax.home/target: pbs-exporter
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 45s
