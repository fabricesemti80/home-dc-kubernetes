---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-pbs-overview
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  pbs-overview.json: |
    {
      "uid": "pbs-overview",
      "title": "Proxmox Backup Server",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "60s",
      "time": {"from": "now-7d", "to": "now"},
      "panels": [
        {
          "id": 1, "type": "stat", "title": "PBS API available",
          "gridPos": {"h": 5, "w": 8, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"expr": "pbs_up", "refId": "A"}]
        },
        {
          "id": 2, "type": "gauge", "title": "Datastore available space",
          "gridPos": {"h": 5, "w": 8, "x": 8, "y": 0},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
          "targets": [{"expr": "pbs_available / pbs_size", "legendFormat": "{{datastore}}", "refId": "A"}]
        },
        {
          "id": 3, "type": "stat", "title": "Total snapshots",
          "gridPos": {"h": 5, "w": 8, "x": 16, "y": 0},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"expr": "sum(pbs_snapshot_count)", "refId": "A"}]
        },
        {
          "id": 4, "type": "timeseries", "title": "Age of most recent backup by guest",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 5},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [{"expr": "time() - pbs_snapshot_vm_last_timestamp", "legendFormat": "{{datastore}} / {{vm_id}} {{vm_name}}", "refId": "A"}]
        }
      ]
    }
