---
global:
  createDefaultServiceAccount: false
controllers:
  pbs-exporter:
    annotations:
      reloader.stakater.com/auto: 'true'
    containers:
      app:
        image:
          repository: ghcr.io/natrontech/pbs-exporter
          tag: v0.10.0
        env:
          PBS_ENDPOINT: https://pbs.krapulax.home:8007
          PBS_USERNAME: prometheus@pbs
          PBS_API_TOKEN_NAME: victoriametrics
          PBS_API_TOKEN_FILE: /etc/pbs-credentials/PBS_MONITORING_TOKEN_SECRET
          PBS_INSECURE: 'false'
          SSL_CERT_FILE: /etc/pbs-ca/ca.pem
          PBS_WRITE_TIMEOUT: 40s
          PBS_TIMEOUT: 10s
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 10019
              periodSeconds: 30
              timeoutSeconds: 5
          readiness: *probe
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
  pbs-tasks:
    containers:
      app:
        image:
          repository: docker.io/library/python
          tag: 3.15.1-slim
        command: [python3, -u, /etc/pbs-tasks/task_exporter.py]
        env:
          PBS_API_TOKEN_FILE: /etc/pbs-credentials/PBS_MONITORING_TOKEN_SECRET
          SSL_CERT_FILE: /etc/pbs-ca/ca.pem
        probes:
          liveness: &task-probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 10020
              periodSeconds: 30
              timeoutSeconds: 5
          readiness: *task-probe
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
defaultPodOptions:
  automountServiceAccountToken: false
  hostAliases:
    - ip: 10.0.40.20
      hostnames:
        - pbs.krapulax.home
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
service:
  app:
    controller: pbs-exporter
    labels:
      monitoring.krapulax.home/target: pbs-exporter
    ports:
      http:
        port: 10019
  tasks:
    controller: pbs-tasks
    labels:
      monitoring.krapulax.home/target: pbs-tasks
    ports:
      http:
        port: 10020
persistence:
  ca:
    type: configMap
    name: pbs-exporter-ca
    globalMounts:
      - path: /etc/pbs-ca
        readOnly: true
  credentials:
    type: secret
    name: pbs-exporter-credentials
    globalMounts:
      - path: /etc/pbs-credentials
        readOnly: true
  task-script:
    type: configMap
    name: pbs-task-script
    globalMounts:
      - path: /etc/pbs-tasks
        readOnly: true
