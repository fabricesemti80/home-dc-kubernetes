---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: netbox-config
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-infra
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: infra
  managedSecret:
    name: netbox-config
    namespace: netbox
    type: Opaque
  secrets:
    - NETBOX_SECRET_KEY
  processors:
    NETBOX_SECRET_KEY:
      asName: secret_key
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: netbox-superuser
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-infra
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: infra
  managedSecret:
    name: netbox-superuser
    namespace: netbox
    type: kubernetes.io/basic-auth
  secrets:
    - NETBOX_SUPERUSER_USERNAME
    - NETBOX_SUPERUSER_PASSWORD
    - NETBOX_SUPERUSER_EMAIL
    - NETBOX_SUPERUSER_APITOKEN
  processors:
    NETBOX_SUPERUSER_USERNAME:
      asName: username
    NETBOX_SUPERUSER_PASSWORD:
      asName: password
    NETBOX_SUPERUSER_EMAIL:
      asName: email
    NETBOX_SUPERUSER_APITOKEN:
      asName: api_token
