---
fullnameOverride: litellm

replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm
  tag: v1.101.0
  pullPolicy: IfNotPresent

nodeSelector:
  kubernetes.io/hostname: infra-cp-01
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
affinity: {}

service:
  type: ClusterIP
  port: 4000

masterkeySecretName: litellm-secrets
masterkeySecretKey: LITELLM_MASTER_KEY
environmentSecrets:
  - litellm-secrets

deploymentAnnotations:
  secret.reloader.stakater.com/reload: litellm-secrets,litellm-postgres

proxy_config:
  model_list:
    - model_name: gpt-5-mini
      litellm_params:
        model: openai/gpt-5-mini
        api_key: os.environ/OPENAI_API_KEY
  general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY
    store_model_in_db: true
    enable_drain_endpoint: true

db:
  useExisting: true
  deployStandalone: false
  endpoint: litellm-postgres
  database: litellm
  secret:
    name: litellm-postgres
    usernameKey: LITELLM_USERDB_USER
    passwordKey: LITELLM_USERDB_PASSWORD

environment:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: litellm-postgres
        key: DATABASE_URL
redis:
  enabled: false

migrationJob:
  enabled: true
  hooks:
    argocd:
      enabled: true
    helm:
      enabled: false

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 4Gi

serviceMonitor:
  enabled: false
