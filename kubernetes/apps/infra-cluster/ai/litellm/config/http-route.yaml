---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  namespace: ai
  annotations:
    external-dns.alpha.kubernetes.io/hostname: litellm.krapulax.dev
    external-dns.alpha.kubernetes.io/target: external-infra.krapulax.dev
    gethomepage.dev/description: "Shared LLM gateway"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Infra Cluster - ai"
    gethomepage.dev/href: "https://litellm.krapulax.dev/ui"
    gethomepage.dev/icon: "litellm.png"
    gethomepage.dev/name: "LiteLLM"
    gethomepage.dev/weight: "20"
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: http
  hostnames:
    - litellm.krapulax.dev
  rules:
    - backendRefs:
        - name: litellm
          namespace: ai
          port: 4000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm-internal
  namespace: ai
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: http
  hostnames:
    - litellm.krapulax.home
  rules:
    - backendRefs:
        - name: litellm
          namespace: ai
          port: 4000
