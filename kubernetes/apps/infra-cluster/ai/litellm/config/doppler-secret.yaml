---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: litellm-secrets
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-infra
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: infra
  managedSecret:
    name: litellm-secrets
    namespace: ai
    type: Opaque
  processors:
    LITELLM_MASTER_KEY:
      asName: PROXY_MASTER_KEY
  secrets:
    - LITELLM_MASTER_KEY
    - LITELLM_SALT_KEY
    - OPENAI_API_KEY
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: litellm-postgres
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-infra
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: infra
  managedSecret:
    name: litellm-postgres
    namespace: ai
    type: Opaque
  processors:
    LITELLM_POSTGRES_USER:
      asName: POSTGRES_USER
    LITELLM_POSTGRES_PASSWORD:
      asName: POSTGRES_PASSWORD
    LITELLM_POSTGRES_DB:
      asName: POSTGRES_DB
    LITELLM_USERDB_USER:
      asName: USERDB_USER
    LITELLM_USERDB_PASSWORD:
      asName: USERDB_PASSWORD
  secrets:
    - LITELLM_POSTGRES_USER
    - LITELLM_POSTGRES_PASSWORD
    - LITELLM_POSTGRES_DB
    - LITELLM_USERDB_USER
    - LITELLM_USERDB_PASSWORD
