---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.1/kubevirt-operator.yaml
  - https://github.com/kubevirt/containerized-data-importer/releases/download/v1.66.1/cdi-operator.yaml
patches:
  - target:
      kind: Namespace
    patch: |
      - op: add
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/enforce-version: latest
  - target:
      kind: Deployment
      name: virt-operator
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: virt-operator
      spec:
        replicas: 1
        template:
          spec:
            nodeSelector:
              homelab.krapulax.dev/kubevirt-spike: 'true'
            tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
  - target:
      kind: Deployment
      name: cdi-operator
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cdi-operator
      spec:
        replicas: 1
        template:
          spec:
            nodeSelector:
              homelab.krapulax.dev/kubevirt-spike: 'true'
            tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
