---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: cirros-spike
  namespace: kubevirt-lab
  labels:
    kubevirt-manager.io/managed: "true"
spec:
  runStrategy: Manual
  template:
    metadata:
      labels:
        kubevirt.io/domain: cirros-spike
        kubevirt-manager.io/managed: "true"
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/kubevirt/cirros-container-disk-demo:v1.9.1
