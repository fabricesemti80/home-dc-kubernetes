---
apiVersion: v1
kind: Namespace
metadata:
  name: kubevirt-lab
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: spike-budget
  namespace: kubevirt-lab
spec:
  hard:
    requests.cpu: '2'
    requests.memory: 3Gi
    limits.cpu: '4'
    limits.memory: 4Gi
    requests.storage: 16Gi
    persistentvolumeclaims: '3'
    count/virtualmachines.kubevirt.io: '1'
