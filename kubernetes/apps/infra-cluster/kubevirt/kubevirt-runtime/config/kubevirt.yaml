---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  uninstallStrategy: BlockUninstallIfWorkloadsExist
  infra:
    replicas: 1
    nodePlacement:
      nodeSelector: &id001
        homelab.krapulax.dev/kubevirt-spike: 'true'
      tolerations: &id002
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
  workloads:
    nodePlacement:
      nodeSelector: *id001
      tolerations: *id002
