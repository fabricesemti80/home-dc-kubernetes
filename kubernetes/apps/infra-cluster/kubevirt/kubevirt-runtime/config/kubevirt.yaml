---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  uninstallStrategy: BlockUninstallIfWorkloadsExist
  infra:
    replicas: 1
    nodePlacement:
      nodeSelector: &linuxNodes
        kubernetes.io/os: linux
      tolerations: &id001
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
  workloads:
    nodePlacement:
      nodeSelector: *linuxNodes
      tolerations: *id001
