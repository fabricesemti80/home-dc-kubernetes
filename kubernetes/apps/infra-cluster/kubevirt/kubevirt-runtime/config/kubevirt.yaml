---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  uninstallStrategy: BlockUninstallIfWorkloadsExist
  infra:
    replicas: 1
    nodePlacement:
      tolerations: &id001
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
  workloads:
    nodePlacement:
      tolerations: *id001
