---
controllers:
  kubevirt-manager:
    type: deployment
    replicas: 1
    strategy: Recreate
    serviceAccount:
      identifier: main
    containers:
      app:
        image:
          repository: docker.io/kubevirtmanager/kubevirt-manager
          tag: 1.5.4
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 30000
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              initialDelaySeconds: 5
              periodSeconds: 10
defaultPodOptions:
  securityContext:
    fsGroup: 30000
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  automountServiceAccountToken: true
serviceAccount:
  main:
    enabled: true
    forceRename: kubevirt-manager
service:
  app:
    controller: kubevirt-manager
    type: ClusterIP
    ports:
      http:
        port: 8080
persistence:
  cache:
    type: emptyDir
    globalMounts:
      - path: /var/cache/nginx
  run:
    type: emptyDir
    globalMounts:
      - path: /var/run
