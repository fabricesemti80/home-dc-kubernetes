---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: awx-internal
  namespace: dev
  annotations:
    external-dns.alpha.kubernetes.io/target: kubernetes.krapulax.home
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: http
  hostnames:
    - awx.krapulax.home
  rules:
    - backendRefs:
        # Service created by the awx-operator (`<AWX name>-service`).
        - name: awx-service
          namespace: dev
          port: 80
