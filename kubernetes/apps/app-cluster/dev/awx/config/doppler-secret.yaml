---
# One Secret feeds both operator inputs: `admin_password_secret` reads key
# `password`, `secret_key_secret` reads key `secret_key`.
# AWX_SECRET_KEY encrypts every credential stored in the AWX database: set it
# once before the first sync and never rotate it (a restored database is
# unreadable without the original value).
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: awx-secrets
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-apps
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: apps
  managedSecret:
    name: awx-secrets
    namespace: dev
    type: Opaque
  secrets:
    - AWX_ADMIN_PASSWORD
    - AWX_SECRET_KEY
  processors:
    AWX_ADMIN_PASSWORD:
      type: plain
      asName: password
    AWX_SECRET_KEY:
      type: plain
      asName: secret_key
