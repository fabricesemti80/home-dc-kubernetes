---
image:
  tag: "1.9.2@sha256:80930fdbf98f28d4d5009cc4da8ddedbaa8afc9a6b753419e54d4cd30cea7308"
serviceType: LoadBalancer
service:
  annotations:
    io.cilium/lb-ipam-ips: 10.0.40.153
servers:
  - zones:
      - zone: .
        use_tcp: true
    port: 53
    plugins:
      - name: log
      - name: errors
      - name: health
        configBlock: lameduck 5s
      - name: ready
      - name: k8s_gateway
        parameters: krapulax.dev
        configBlock: |-
          apex k8s-gateway.network
          ttl 1
          resources HTTPRoute Service
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: forward
        parameters: . /etc/resolv.conf
      - name: loop
      - name: reload
      - name: loadbalance
