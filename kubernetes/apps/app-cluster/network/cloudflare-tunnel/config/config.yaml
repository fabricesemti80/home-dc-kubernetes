apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-tunnel-configmap
data:
  config.yaml: |
    ingress:
      # The webhook's Access bypass precedes the TLS-verified public routes.
      - hostname: argo.krapulax.dev
        path: ^/api/webhook$
        service: http://argocd-server.argo-system.svc.cluster.local:80
      - hostname: krapulax.dev
        service: https://envoy-external.network.svc.cluster.local
        originRequest:
          originServerName: external.krapulax.dev
      # Jellyseerr's initial administrator setup remains private.
      - hostname: requests.krapulax.dev
        service: http_status:404
      - hostname: "*.krapulax.dev"
        service: https://envoy-external.network.svc.cluster.local
        originRequest:
          originServerName: external.krapulax.dev
      - service: http_status:404
