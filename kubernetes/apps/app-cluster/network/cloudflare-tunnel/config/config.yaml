apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-tunnel-configmap
data:
  config.yaml: |
    ingress:
      # Keep the first GitOps sync private: only the path-scoped Argo webhook
      # may traverse the retained public tunnel. Promote apex/wildcard ingress
      # in a reviewed Git revision after backup and restore verification.
      - hostname: argo.krapulax.dev
        path: ^/api/webhook$
        service: http://argocd-server.argo-system.svc.cluster.local:80
      - service: http_status:404
