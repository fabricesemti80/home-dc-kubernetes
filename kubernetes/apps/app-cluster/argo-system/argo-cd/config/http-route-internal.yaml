---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-internal
  namespace: argo-system
  annotations:
    external-dns.alpha.kubernetes.io/target: kubernetes.krapulax.home
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: http
  hostnames:
    - argo.krapulax.home
  rules:
    - backendRefs:
        - name: argocd-server
          namespace: argo-system
          port: 80
