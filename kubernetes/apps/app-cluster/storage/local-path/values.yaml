---
# Disable provisioning on all nodes before removing the retired Talos volumes.
nodePathMap:
  - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
    paths: []
storageClass:
  name: local-path
  create: true
  defaultClass: false
  defaultVolumeType: local
  reclaimPolicy: Retain
  volumeBindingMode: WaitForFirstConsumer
nodeSelector:
  kubernetes.io/os: linux
