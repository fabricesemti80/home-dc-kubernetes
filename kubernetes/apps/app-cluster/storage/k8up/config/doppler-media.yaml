---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: k8up-media-critical
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-apps
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: apps
  managedSecret:
    name: k8up-source-credentials
    namespace: media
    type: Opaque
  secrets:
  - K8UP_MEDIA_CRITICAL_6H_PASSWORD
  - IMMICH_BACKUP_PASSWORD
  - SLACK_WEBHOOK_MONITORING
