---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8s-backup-app-cluster-media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    k8up.io/backup: 'false'
spec:
  capacity:
    storage: 8Ti
  volumeMode: Filesystem
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  claimRef:
    namespace: media
    name: k8s-backup-repository
  nfs:
    server: 10.0.40.2
    path: /k8s-backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8s-backup-repository
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    k8up.io/backup: 'false'
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: ''
  volumeName: k8s-backup-app-cluster-media
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8up-source-reader
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8up-source-reader
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8up-source-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8up-source-reader
subjects:
- kind: ServiceAccount
  name: k8up-source-reader
  namespace: media
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8up-policy-auditor
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8up-policy-auditor
rules:
- apiGroups:
  - k8up.io
  resources:
  - backups
  - snapshots
  - checks
  verbs:
  - list
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8up-policy-auditor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8up-policy-auditor
subjects:
- kind: ServiceAccount
  name: k8up-policy-auditor
  namespace: media
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: immich-db
  labels:
    backup.krapulax.dev/app: immich-db
    backup.krapulax.dev/policy: critical-6h
    backup.krapulax.dev/strategy: postgres-dump
spec:
  backupCommand: sh /scripts/postgres_export.sh
  fileExtension: .tar
  pod:
    spec:
      automountServiceAccountToken: false
      serviceAccountName: k8up-source-reader
      securityContext:
        runAsNonRoot: true
        runAsUser: 1004
        runAsGroup: 65534
        supplementalGroups: []
        fsGroup: 1004
      initContainers:
      - name: inspect
        image: python:3.14.3-slim@sha256:5e59aae31ff0e87511226be8e2b94d78c58f05216efda3b07dbbed938ec8583b
        command:
        - python3
        - /scripts/source_inspector.py
        env:
        - name: BACKUP_CLUSTER
          value: app-cluster
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SOURCE_SELECTOR
          value: app.kubernetes.io/instance=immich,app.kubernetes.io/controller=database
        - name: SOURCE_CONTAINER
          value: app
        - name: BACKUP_APP
          value: immich-db
        securityContext: &id001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - &id002
          name: scripts
          mountPath: /scripts
          readOnly: true
        - &id003
          name: stage
          mountPath: /stage
        - name: api
          mountPath: /var/run/backup-api
          readOnly: true
      containers:
      - name: immich-db
        image: ghcr.io/immich-app/postgres@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
        command:
        - sleep
        - '1800'
        env:
        - name: PGUSER
          value: k8up_backup
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: k8up-source-credentials
              key: IMMICH_BACKUP_PASSWORD
        - name: PGOPTIONS
          value: -c default_transaction_read_only=on
        - name: PGDATABASE
          value: immich
        securityContext: *id001
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 768Mi
        volumeMounts:
        - *id002
        - *id003
        - name: secret-0
          mountPath: /recovery-secrets/immich-secrets
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: backup-runtime
      - name: stage
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
      - name: api
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
      - name: secret-0
        secret:
          secretName: immich-secrets
          defaultMode: 288
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: critical-6h
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1004
        runAsGroup: 65534
        supplementalGroups: []
      containers:
      - name: k8up
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: repository
        persistentVolumeClaim:
          claimName: k8s-backup-repository
      - name: tmp
        emptyDir: {}
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: critical-6h
spec:
  podConfigRef:
    name: critical-6h
  backend:
    local:
      mountPath: /repository/app-cluster/media/critical-6h
    repoPasswordSecretRef:
      name: k8up-source-credentials
      key: K8UP_MEDIA_CRITICAL_6H_PASSWORD
    volumeMounts:
    - name: repository
      mountPath: /repository
  failedJobsHistoryLimit: 24
  successfulJobsHistoryLimit: 48
  resourceRequirementsTemplate:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 1Gi
  backup:
    schedule: 20 */6 * * *
    clusterName: app-cluster
    activeDeadlineSeconds: 900
    concurrentRunsAllowed: false
    labelSelectors:
    - matchLabels:
        backup.krapulax.dev/policy: critical-6h
        backup.krapulax.dev/strategy: postgres-dump
  check:
    schedule: 20 2 * * 0
    activeDeadlineSeconds: 1800
    concurrentRunsAllowed: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: critical-6h-read-data
spec:
  schedule: 10 5 1 * *
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        backup.krapulax.dev/maintenance: read-data
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1004
            runAsGroup: 65534
            supplementalGroups: []
          volumes:
          - name: repository
            persistentVolumeClaim:
              claimName: k8s-backup-repository
          - name: tmp
            emptyDir: {}
          containers:
          - name: restic
            image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
            command:
            - restic
            - check
            - --read-data
            env:
            - name: RESTIC_REPOSITORY
              value: /repository/app-cluster/media/critical-6h
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8up-source-credentials
                  key: K8UP_MEDIA_CRITICAL_6H_PASSWORD
            - name: RESTIC_CACHE_DIR
              value: /tmp/cache
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: '1'
                memory: 768Mi
            volumeMounts:
            - name: repository
              mountPath: /repository
            - name: tmp
              mountPath: /tmp
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: critical-6h-audit
spec:
  schedule: '*/15 * * * *'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 180
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1004
            runAsGroup: 65534
            supplementalGroups: []
            fsGroup: 1004
          volumes:
          - name: repository
            persistentVolumeClaim:
              claimName: k8s-backup-repository
          - name: tmp
            emptyDir: {}
          - name: scripts
            configMap:
              name: backup-runtime
          - name: api
            projected:
              defaultMode: 288
              sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                  - key: ca.crt
                    path: ca.crt
          serviceAccountName: k8up-policy-auditor
          containers:
          - name: audit
            image: python:3.14.3-slim@sha256:5e59aae31ff0e87511226be8e2b94d78c58f05216efda3b07dbbed938ec8583b
            command:
            - python3
            - /scripts/audit.py
            env:
            - name: BACKUP_CLUSTER
              value: app-cluster
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FULL_CHECK_BASELINE
              value: '2026-10-30T12:32:31.984721+00:00'
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: k8up-source-credentials
                  key: SLACK_WEBHOOK_MONITORING
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 96Mi
            volumeMounts:
            - name: repository
              mountPath: /repository
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: api
              mountPath: /var/run/backup-api
              readOnly: true
            - name: tmp
              mountPath: /tmp
