---
global:
  createDefaultServiceAccount: false
defaultPodOptions:
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: k8s-wrkr-03
  securityContext:
    runAsNonRoot: true
    runAsUser: 1004
    runAsGroup: 65534
    fsGroup: 1004
    supplementalGroups: []
    seccompProfile:
      type: RuntimeDefault
controllers:
  backrest:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: 'true'
    initContainers:
      configure:
        image:
          repository: python
          tag: 3.15.2-slim@sha256:c4158543ecb725b99e57d129dfd43d761d4c43e4577b5e23326aabb223cf7f4e
        command:
        - python3
        - /runtime/init.py
        env:
          CLUSTER_NAME: app-cluster
        envFrom:
        - secretRef:
            name: backrest-secrets
        securityContext: &id001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
    containers:
      app:
        image:
          repository: ghcr.io/garethgeorge/backrest
          tag: v1.14.1@sha256:b852979754281026230cc69fb11428e6d57c9a97784ab4a444ffc7934c53a215
        command:
        - /backrest
        env:
          BACKREST_PORT: 0.0.0.0:9898
          BACKREST_CONFIG: /state/config.json
          BACKREST_DATA: /state/data
          BACKREST_RESTIC_COMMAND: /bin/restic
          HOME: /state
          XDG_CACHE_HOME: /cache
          TMPDIR: /tmp
          TZ: UTC
        securityContext: *id001
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        probes:
          liveness:
            enabled: true
            type: TCP
          readiness:
            enabled: true
            type: TCP
          startup:
            enabled: true
            type: TCP
service:
  app:
    controller: backrest
    ports:
      http:
        port: 9898
persistence:
  state:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: local-path
    size: 4Gi
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    globalMounts:
    - path: /state
  target:
    existingClaim: k8s-backup
    advancedMounts:
      backrest:
        configure:
        - path: /nas
        app:
        - path: /backups
  runtime:
    type: configMap
    name: backrest-runtime
    advancedMounts:
      backrest:
        configure:
        - path: /runtime
          readOnly: true
  settings:
    type: configMap
    name: backrest-settings
    advancedMounts:
      backrest:
        configure:
        - path: /settings
          readOnly: true
  cache:
    type: emptyDir
    sizeLimit: 2Gi
    globalMounts:
    - path: /cache
  tmp:
    type: emptyDir
    sizeLimit: 512Mi
    globalMounts:
    - path: /tmp
  photos:
    type: custom
    volumeSpec:
      nfs:
        server: 10.0.40.2
        path: /media/immich
        readOnly: true
    advancedMounts:
      backrest:
        app:
        - path: /photos
          readOnly: true
