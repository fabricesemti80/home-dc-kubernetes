---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backrest
  namespace: backups
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Backrest app
    gethomepage.dev/group: app-cluster
    gethomepage.dev/icon: backrest.png
    gethomepage.dev/description: Encrypted backups and restores
    external-dns.alpha.kubernetes.io/target: kubernetes.krapulax.home
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: http
  hostnames:
  - backrest.krapulax.home
  rules:
  - backendRefs:
    - name: backrest
      port: 9898
