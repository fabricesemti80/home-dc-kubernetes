---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: backrest-app
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-apps
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: apps
  managedSecret:
    name: backrest-secrets
    namespace: backups
    type: Opaque
  secrets:
  - BACKREST_REPOSITORY_PASSWORD
  - BACKREST_ADMIN_PASSWORD_BCRYPT
  - SLACK_WEBHOOK_MONITORING
  - IMMICH_BACKUP_PASSWORD
  - IMMICH_DB_PASSWORD
