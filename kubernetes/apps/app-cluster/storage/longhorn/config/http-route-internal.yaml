---
# Internal-only UI: bound to envoy-internal on the LAN, no Cloudflare tunnel / external route.
# The Longhorn UI has no built-in authentication.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-internal
  namespace: longhorn-system
  annotations:
    external-dns.alpha.kubernetes.io/target: kubernetes.krapulax.home
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: http
  hostnames:
    - longhorn.krapulax.home
  rules:
    - backendRefs:
        - name: longhorn-frontend
          port: 80
