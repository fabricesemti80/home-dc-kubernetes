---
# protect: false on an app opts it out (default: protected).
cluster: app-cluster
apps:
- name: sonarr
  namespace: media
  selector:
    app.kubernetes.io/instance: sonarr
    app.kubernetes.io/controller: sonarr
  claim: sonarr-longhorn
  excludes: &id001
  - MediaCover
  - logs
  - Logs
  - logs.db*
  schedule: 0 1 * * *
- name: radarr
  namespace: media
  selector:
    app.kubernetes.io/instance: radarr
    app.kubernetes.io/controller: radarr
  claim: radarr-longhorn
  excludes: *id001
  schedule: 5 1 * * *
- name: prowlarr
  namespace: media
  selector:
    app.kubernetes.io/instance: prowlarr
    app.kubernetes.io/controller: prowlarr
  claim: prowlarr-longhorn
  excludes: *id001
  schedule: 10 1 * * *
- name: jellyseerr
  namespace: media
  selector:
    app.kubernetes.io/instance: jellyseerr
    app.kubernetes.io/controller: jellyseerr
  claim: jellyseerr-longhorn
  excludes:
  - logs
  schedule: 15 1 * * *
- name: sabnzbd
  namespace: media
  node: k8s-wrkr-03
  claim: sabnzbd
  excludes:
  - logs
  schedule: 20 1 * * *
- name: qbittorrent
  namespace: media
  node: k8s-wrkr-03
  claim: qbittorrent
  excludes:
  - logs
  schedule: 25 1 * * *
- name: recyclarr
  namespace: media
  selector:
    app.kubernetes.io/instance: recyclarr
    app.kubernetes.io/controller: recyclarr
  claim: recyclarr-longhorn
  excludes:
  - cache
  - logs
  - repositories
  schedule: 30 1 * * *
- name: jellyfin
  namespace: media
  node: k8s-wrkr-01-gpu
  claim: jellyfin-config
  excludes:
  - cache
  - log
  - transcodes
  - metadata
  schedule: 35 1 * * *
- name: freqtrade
  namespace: trading
  selector:
    app.kubernetes.io/instance: freqtrade
    app.kubernetes.io/controller: freqtrade
  claim: freqtrade-data
  excludes:
  - data
  - logs
  - backtest_results
  - hyperopt_results
  - plot
  schedule: 40 1 * * *
- name: vmagent-queue
  namespace: monitoring
  protect: false
