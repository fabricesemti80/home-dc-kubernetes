---
args:
  - --kubelet-insecure-tls
  - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
  - --kubelet-use-node-status-port
  - --metric-resolution=10s
  - --kubelet-request-timeout=2s
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
metrics:
  enabled: true
serviceMonitor:
  # Its chart-generated scrape disables TLS verification. Keep it out of the
  # Prometheus-to-VictoriaMetrics converter until its serving trust is fixed.
  enabled: false
