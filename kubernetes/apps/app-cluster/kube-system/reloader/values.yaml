---
fullnameOverride: reloader
reloader:
  readOnlyRootFileSystem: true
  podMonitor:
    enabled: true
    namespace: "{{ .Release.Namespace }}"
  deployment:
    # The chart only reads reloader.deployment.resources; a top-level
    # reloader.resources key is silently ignored.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
