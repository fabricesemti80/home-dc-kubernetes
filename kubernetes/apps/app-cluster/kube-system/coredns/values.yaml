---
fullnameOverride: coredns
image:
  repository: registry.k8s.io/coredns/coredns
  tag: v1.15.0
k8sAppLabelOverride: kube-dns
serviceAccount:
  create: true
service:
  name: kube-dns
  clusterIP: "10.43.0.10"
replicaCount: 2
servers:
  # Local zone: resolve homelab names from Technitium (10.0.40.53), which holds the
  # records ExternalDNS publishes for both clusters. The nodes only use public
  # resolvers, which do not know the infra-cluster names. Everything else keeps
  # using the node resolvers. If Technitium is unreachable, stale answers are
  # served for up to an hour (serve_stale); a name not looked up in that window fails.
  - zones:
      - zone: krapulax.home
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      # Same as the default zone: no unusable AAAA answers (IPv6 is disabled).
      - name: template
        parameters: IN AAAA
        configBlock: |-
          rcode NOERROR
      - name: forward
        parameters: . 10.0.40.53
        configBlock: |-
          max_concurrent 1000
      - name: cache
        parameters: "60"
        configBlock: |-
          serve_stale
      - name: loop
      - name: prometheus
        parameters: 0.0.0.0:9153
  # Torrent indexer domains used by Prowlarr. The public resolvers the nodes use
  # (1.1.1.1, 1.0.0.1, 8.8.8.8) answer 0.0.0.0 for these names from this network, so
  # Prowlarr cannot connect; Technitium resolves them. Only these exact domains (and
  # their subdomains) are sent to Technitium; add a domain here only after checking
  # that the site is reachable. Not covered, because the sites refuse this network or
  # sit behind a Cloudflare challenge: EZTV (HTTP 451), 1337x, kickasstorrents.
  - zones:
      - zone: knaben.org
        scheme: dns://
        use_tcp: true
      - zone: uindex.org
        scheme: dns://
        use_tcp: true
      - zone: limetorrents.fun
        scheme: dns://
        use_tcp: true
      - zone: torrentdownloads.pro
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: template
        parameters: IN AAAA
        configBlock: |-
          rcode NOERROR
      - name: forward
        parameters: . 10.0.40.53
        configBlock: |-
          max_concurrent 1000
      - name: cache
        parameters: "300"
        configBlock: |-
          serve_stale
      - name: loop
      - name: prometheus
        parameters: 0.0.0.0:9153
  - zones:
      - zone: .
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: kubernetes
        parameters: cluster.local in-addr.arpa ip6.arpa
        configBlock: |-
          pods verified
          fallthrough in-addr.arpa ip6.arpa
      - name: autopath
        parameters: "@kubernetes"
      # The cluster has IPv6 disabled in Cilium and no IPv6 default route.
      # Do not return unusable AAAA answers to workloads.
      - name: template
        parameters: IN AAAA
        configBlock: |-
          rcode NOERROR
      - name: forward
        parameters: . /etc/resolv.conf
      - name: cache
        configBlock: |-
          prefetch 20
          serve_stale
      - name: loop
      - name: reload
      - name: loadbalance
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: log
        configBlock: |-
          class error
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 512Mi
