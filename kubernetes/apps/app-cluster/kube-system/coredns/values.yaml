---
fullnameOverride: coredns
image:
  repository: registry.k8s.io/coredns/coredns
  tag: v1.15.0
k8sAppLabelOverride: kube-dns
serviceAccount:
  create: true
service:
  name: kube-dns
  clusterIP: "10.43.0.10"
replicaCount: 2
servers:
  # Local zone: resolve homelab names from Technitium (10.0.40.53), which holds the
  # records ExternalDNS publishes for both clusters. The nodes only use public
  # resolvers, which do not know the infra-cluster names. Everything else keeps
  # using the node resolvers. If Technitium is unreachable, stale answers are
  # served for up to an hour (serve_stale); a name not looked up in that window fails.
  - zones:
      - zone: krapulax.home
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      # Same as the default zone: no unusable AAAA answers (IPv6 is disabled).
      - name: template
        parameters: IN AAAA
        configBlock: |-
          rcode NOERROR
      - name: forward
        parameters: . 10.0.40.53
        configBlock: |-
          max_concurrent 1000
      - name: cache
        parameters: "60"
        configBlock: |-
          serve_stale
      - name: loop
      - name: prometheus
        parameters: 0.0.0.0:9153
  - zones:
      - zone: .
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: kubernetes
        parameters: cluster.local in-addr.arpa ip6.arpa
        configBlock: |-
          pods verified
          fallthrough in-addr.arpa ip6.arpa
      - name: autopath
        parameters: "@kubernetes"
      # The cluster has IPv6 disabled in Cilium and no IPv6 default route.
      # Do not return unusable AAAA answers to workloads.
      - name: template
        parameters: IN AAAA
        configBlock: |-
          rcode NOERROR
      # Torrent indexer domains used by Prowlarr. The public resolvers the nodes use
      # (1.1.1.1, 1.0.0.1, 8.8.8.8) answer 0.0.0.0 for these names from this network, so
      # Prowlarr cannot connect; Technitium resolves them. Only these domains (and their
      # subdomains) go to Technitium; add one only after checking the site is reachable.
      # Not covered: EZTV (HTTP 451), 1337x and kickasstorrents (Cloudflare challenge).
      # This must be a stanza of this server block, not a separate zone block: autopath
      # resolves search-path queries through this block's chain, and accepts the public
      # resolvers' 0.0.0.0 answer before a separate zone block is ever consulted.
      # forward accepts a single FROM zone, hence one stanza per domain.
      - name: forward
        parameters: knaben.org 10.0.40.53
        configBlock: |-
          max_concurrent 1000
      - name: forward
        parameters: uindex.org 10.0.40.53
        configBlock: |-
          max_concurrent 1000
      - name: forward
        parameters: limetorrents.fun 10.0.40.53
        configBlock: |-
          max_concurrent 1000
      - name: forward
        parameters: torrentdownloads.pro 10.0.40.53
        configBlock: |-
          max_concurrent 1000
      - name: forward
        parameters: . /etc/resolv.conf
      - name: cache
        configBlock: |-
          prefetch 20
          serve_stale
      - name: loop
      - name: reload
      - name: loadbalance
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: log
        configBlock: |-
          class error
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 512Mi
