---
global:
  createDefaultServiceAccount: false

defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

controllers:
  rcon-web-admin:
    replicas: 1
    strategy: Recreate
    annotations:
      secret.reloader.stakater.com/reload: rcon-web-admin-secrets
    containers:
      app:
        image:
          repository: docker.io/itzg/rcon
          tag: "0.14.1-1"
          pullPolicy: IfNotPresent
        env:
          RWA_ENV: "TRUE"
          RWA_USERNAME: admin
          RWA_ADMIN: "TRUE"
          RWA_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: rcon-web-admin-secrets
                key: RCON_WEB_ADMIN_PASSWORD
          RWA_GAME: minecraft
          RWA_SERVER_NAME: Minecraft
          RWA_RCON_HOST: minecraft-rcon.gaming.svc.cluster.local
          RWA_RCON_PORT: "25575"
          RWA_RCON_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: rcon-web-admin-secrets
                key: RCON_PASSWORD
          RWA_WEB_RCON: "FALSE"
          RWA_WEBSOCKET_URL: ws://minecraft-admin-ws.krapulax.dev
          RWA_WEBSOCKET_URL_SSL: wss://minecraft-admin-ws.krapulax.dev
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 4326
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 4326
              periodSeconds: 5
              failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

service:
  app:
    controller: rcon-web-admin
    ports:
      http:
        port: 80
        targetPort: 4326
      ws:
        port: 4327
        targetPort: 4327

persistence:
  db:
    type: persistentVolumeClaim
    accessMode: ReadWriteMany
    storageClass: cephfs
    size: 1Gi
    globalMounts:
      - path: /opt/rcon-web-admin/db
  logs:
    type: emptyDir
    globalMounts:
      - path: /opt/rcon-web-admin/logs
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
