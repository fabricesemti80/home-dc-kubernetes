---
global:
  createDefaultServiceAccount: false

defaultPodOptions:
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: k8s-wrkr-03

controllers:
  prowlarr:
    strategy: RollingUpdate
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/prowlarr
          tag: latest
          digest: sha256:431d7efebcef466e56adaa40a7a2fa2b0e85159a037b8bf465eaadbf0cf5bedf
        env:
          TZ: Europe/London
          PUID: "0"
          PGID: "0"
          UMASK: "002"
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: 9696
              initialDelaySeconds: 30
              periodSeconds: 20
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 1Gi

service:
  app:
    controller: prowlarr
    ports:
      http:
        port: 9696
        targetPort: 9696

persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: prowlarr-longhorn # Longhorn volume declared in config/pvc-config-longhorn.yaml
    globalMounts:
      - path: /config
