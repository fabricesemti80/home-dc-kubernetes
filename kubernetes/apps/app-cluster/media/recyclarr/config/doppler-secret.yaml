---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: recyclarr-secrets
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-apps
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: apps
  managedSecret:
    name: recyclarr-secrets
    namespace: media
    type: Opaque
  secrets:
    - SONARR_API_KEY
    - RADARR_API_KEY
