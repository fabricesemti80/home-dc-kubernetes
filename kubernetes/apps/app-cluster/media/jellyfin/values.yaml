---
global:
  createDefaultServiceAccount: false

defaultPodOptions:
  automountServiceAccountToken: false
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: k8s-wrkr-01-gpu

controllers:
  jellyfin:
    # Config includes SQLite state and the workload is pinned to one node;
    # do not require two 3GiB pods during an update.
    strategy: Recreate
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/jellyfin
          tag: "10.11.11"
        env:
          TZ: Europe/London
          PUID: "0"
          PGID: "0"
          JELLYFIN_PreferredMetadataLanguage: eng
          JELLYFIN_Codepage: ""
          JELLYFIN_MaxStreamBitrate: "80000000"
          JELLYFIN_TranscodeMaxAudioChannels: "2"
          # GPU transcoding path; CPU fallback retained by keeping threads <= vCPU count
          JELLYFIN_FFmpeg_CpuThreads: "4"
          JELLYFIN_EncodingThreadCount: "4"
          JELLYFIN_CACHE_DIR: /cache
        resources:
          requests:
            cpu: 2000m
            memory: 3Gi
          limits:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: "1"
        probes:
          # Kestrel is live while Jellyfin's ffmpeg capability scan temporarily
          # makes /health return 503. Do not restart a healthy process mid-scan.
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8096
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 3
          # Jellyfin may return HTTP 200 with body Degraded; gate traffic on Healthy.
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - test "$(curl -fsS http://127.0.0.1:8096/health)" = Healthy
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - test "$(curl -fsS http://127.0.0.1:8096/health)" = Healthy
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 60

service:
  app:
    controller: jellyfin
    ports:
      http:
        port: 8096
        targetPort: 8096

persistence:
  transcode:
    type: emptyDir
    medium: Memory
    globalMounts:
      - path: /transcode
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: local-path
    size: 5Gi
    globalMounts:
      - path: /config
  cache:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: local-path
    size: 20Gi
    globalMounts:
      - path: /cache
  media:
    enabled: true
    existingClaim: media-library-pvc
    globalMounts:
      - path: /data
