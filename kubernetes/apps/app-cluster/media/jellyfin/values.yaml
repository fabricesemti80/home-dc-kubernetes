---
global:
  createDefaultServiceAccount: false

defaultPodOptions:
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: k8s-ctrl-03

controllers:
  jellyfin:
    # Config includes SQLite state and the workload is pinned to one node;
    # do not require two 3GiB pods during an update.
    strategy: Recreate
    pod:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: In
                      values:
                        - immich
                topologyKey: kubernetes.io/hostname
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/jellyfin
          tag: "10.11.11"
        env:
          TZ: Europe/London
          PUID: "0"
          PGID: "0"
          JELLYFIN_PreferredMetadataLanguage: eng
          JELLYFIN_Codepage: ""
          JELLYFIN_MaxStreamBitrate: "80000000"
          JELLYFIN_TranscodeMaxAudioChannels: "2"
          # Software transcoding tuning — 10 cores available
          JELLYFIN_FFmpeg_CpuThreads: "8"
          JELLYFIN_EncodingThreadCount: "8"
          JELLYFIN_CACHE_DIR: /cache
        probes:
          # Kestrel is live while Jellyfin's ffmpeg capability scan temporarily
          # makes /health return 503. Do not restart a healthy process mid-scan.
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8096
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 3
          # Keep traffic gated on the application-level health endpoint.
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8096
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 3
          # Jellyfin validates ffmpeg capabilities during startup. Keep it out
          # of service endpoints until /health succeeds, without liveness
          # restarts interrupting that validation.
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8096
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 60
        resources:
          requests:
            cpu: 2000m
            memory: 3Gi
          limits:
            cpu: 9500m
            memory: 8Gi

service:
  app:
    controller: jellyfin
    ports:
      http:
        port: 8096
        targetPort: 8096

persistence:
  transcode:
    type: emptyDir
    medium: Memory
    globalMounts:
      - path: /transcode
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteMany
    storageClass: cephfs
    size: 5Gi
    globalMounts:
      - path: /config
  cache:
    type: persistentVolumeClaim
    accessMode: ReadWriteMany
    storageClass: cephfs
    size: 20Gi
    globalMounts:
      - path: /cache
  media:
    enabled: true
    existingClaim: media-library-pvc
    globalMounts:
      - path: /data
