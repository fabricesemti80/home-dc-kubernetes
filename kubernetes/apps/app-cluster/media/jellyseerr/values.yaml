---
global:
  createDefaultServiceAccount: false

defaultPodOptions:
  automountServiceAccountToken: false
  # Keep the permission fix for copied config files owned by the non-root node user.
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  jellyseerr:
    # The first start of a new major version migrates the SQLite database in place
    # (one-way). Never run the old and the new pod against it at the same time.
    strategy: Recreate
    initContainers:
      fix-permissions:
        image:
          repository: docker.io/library/alpine
          tag: "3.24"
        command:
          - sh
          - -c
          - chown -R 1000:1000 /app/config
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
    containers:
      app:
        # Jellyseerr is now Seerr (seerr-team/seerr). The fallenbagel/jellyseerr image
        # is frozen at 2.7.3 and deprecated; the data migrates automatically on first start.
        image:
          repository: ghcr.io/seerr-team/seerr
          tag: v3.5.2
          digest: sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
        env:
          TZ: Europe/London
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/status
                port: 5055
              initialDelaySeconds: 45
              periodSeconds: 20
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi

service:
  app:
    controller: jellyseerr
    ports:
      http:
        port: 5055
        targetPort: 5055

persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: jellyseerr-longhorn
    globalMounts:
      - path: /app/config
