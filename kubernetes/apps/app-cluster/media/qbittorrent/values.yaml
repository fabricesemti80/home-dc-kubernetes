---
global:
  createDefaultServiceAccount: false

controllers:
  qbittorrent:
    strategy: Recreate
    initContainers:
      webui-password:
        image:
          repository: lscr.io/linuxserver/qbittorrent
          tag: latest
        command:
          - /usr/bin/python3
          - -c
        args:
          - |
            import base64
            import hashlib
            import os
            import re
            import secrets
            from pathlib import Path

            config = Path("/config/qBittorrent/qBittorrent.conf")
            config.parent.mkdir(parents=True, exist_ok=True)
            password = os.environ["QBITTORRENT_WEBUI_PASSWORD"].encode()
            salt = secrets.token_bytes(16)
            digest = hashlib.pbkdf2_hmac("sha512", password, salt, 100000)
            value = "@ByteArray({}:{})".format(
                base64.b64encode(salt).decode(), base64.b64encode(digest).decode()
            )
            setting = f'WebUI\\Password_PBKDF2="{value}"'
            text = config.read_text() if config.exists() else "[Preferences]\n"
            if re.search(r"^WebUI\\Password_PBKDF2=.*$", text, flags=re.MULTILINE):
                text = re.sub(r"^WebUI\\Password_PBKDF2=.*$", setting, text, flags=re.MULTILINE)
            elif "[Preferences]" in text:
                text = text.replace("[Preferences]", f"[Preferences]\n{setting}", 1)
            else:
                text += f"\n[Preferences]\n{setting}\n"
            config.write_text(text)
        env:
          QBITTORRENT_WEBUI_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: qbittorrent-secrets
                key: QBITTORRENT_WEBUI_PASSWORD
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/qbittorrent
          tag: latest
        env:
          TZ: Europe/London
          PUID: "0"
          PGID: "0"
          UMASK: "002"
          WEBUI_PORT: "8080"
          TORRENTING_PORT: "6881"
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8080
              initialDelaySeconds: 30
              periodSeconds: 20
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 2
            memory: 2Gi

defaultPodOptions:
  automountServiceAccountToken: false
  hostname: qbittorrent

service:
  app:
    controller: qbittorrent
    ports:
      http:
        port: 8080
        targetPort: 8080
      bittorrent:
        port: 6881
        targetPort: 6881
        protocol: TCP
      bittorrent-udp:
        port: 6881
        targetPort: 6881
        protocol: UDP

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteMany
    storageClass: cephfs
    size: 2Gi
    globalMounts:
      - path: /config
  downloads:
    enabled: true
    existingClaim: media-library-pvc
    globalMounts:
      - path: /downloads
        subPath: downloads/complete
  incomplete-downloads:
    enabled: true
    existingClaim: media-library-pvc
    globalMounts:
      - path: /incomplete-downloads
        subPath: downloads/incomplete
