---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./http-route.yaml
  - ./http-route-internal.yaml
  - ./pvc-config-longhorn.yaml
  - ./doppler-secret.yaml
configMapGenerator:
  - name: chaptarr-bootstrap
    namespace: media
    files:
      - bootstrap-admin.php
generatorOptions:
  disableNameSuffixHash: true
