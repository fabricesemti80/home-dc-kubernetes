---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chaptarr
  namespace: media
  annotations:
    external-dns.alpha.kubernetes.io/hostname: chaptarr.krapulax.dev
    external-dns.alpha.kubernetes.io/target: external-apps.krapulax.dev
    gethomepage.dev/description: "Ebook and audiobook library automation"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "App Cluster - media"
    gethomepage.dev/href: "https://chaptarr.krapulax.dev"
    gethomepage.dev/icon: "mdi-book-open-page-variant"
    gethomepage.dev/name: "Chaptarr"
    gethomepage.dev/weight: "10"
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - chaptarr.krapulax.dev
  rules:
    - backendRefs:
        - name: chaptarr
          namespace: media
          port: 8789
