---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chaptarr-longhorn
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
