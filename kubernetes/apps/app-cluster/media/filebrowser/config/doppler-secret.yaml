---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: filebrowser-admin
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  tokenSecret:
    name: doppler-token-secret-apps
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: apps
  managedSecret:
    name: filebrowser-admin
    namespace: media
    type: Opaque
  secrets:
    - FILEBROWSER_ADMIN_PASSWORD
