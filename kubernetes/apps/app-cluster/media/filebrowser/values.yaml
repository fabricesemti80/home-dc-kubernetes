---
global:
  createDefaultServiceAccount: false

defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

controllers:
  filebrowser:
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/gtsteffaniak/filebrowser
          tag: "2.0.2-stable"
        env:
          FILEBROWSER_ADMIN_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: filebrowser-admin
                key: FILEBROWSER_ADMIN_PASSWORD
          FILEBROWSER_CONFIG: /etc/filebrowser/config.yaml
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["DAC_OVERRIDE"]
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi

service:
  app:
    controller: filebrowser
    ports:
      http:
        port: 8080
        targetPort: 8080

persistence:
  settings:
    type: configMap
    name: filebrowser-settings
    globalMounts:
      - path: /etc/filebrowser
        readOnly: true
  state:
    existingClaim: filebrowser-longhorn
    globalMounts:
      - path: /home/filebrowser/data
  media:
    existingClaim: media-library-pvc
    globalMounts:
      - path: /media
        readOnly: false
