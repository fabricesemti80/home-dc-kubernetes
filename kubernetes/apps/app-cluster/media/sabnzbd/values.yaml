---
global:
  createDefaultServiceAccount: false

controllers:
  sabnzbd:
    strategy: RollingUpdate
    initContainers:
      whitelist-config:
        image:
          repository: docker.io/library/alpine
          tag: "3.24"
        command:
          - /bin/sh
          - -ec
        args:
          - |
            config_file="/config/sabnzbd.ini"
            whitelist="sabnzbd,sabnzbd.krapulax.dev,sabnzbd.krapulax.home,sabnzbd.media.svc.cluster.local"
            exposure=0

            mkdir -p /config

            if [ -f "${config_file}" ]; then
              exposure="$(awk '
                /^\[misc\][[:space:]]*$/ { in_misc = 1; next }
                /^\[/ { in_misc = 0 }
                in_misc && /^[[:space:]]*(username|password)[[:space:]]*=/ {
                  key = $0
                  sub(/[[:space:]]*=.*/, "", key)
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                  value = $0
                  sub(/^[^=]*=/, "", value)
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                  if (value ~ /^"[^"]*"$/ || value ~ /^\047[^\047]*\047$/) {
                    value = substr(value, 2, length(value) - 2)
                    gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                  }
                  if (key == "username" && value != "") username_set = 1
                  if (key == "password" && value != "") password_set = 1
                }
                END { print username_set && password_set ? 5 : 0 }
              ' "${config_file}")"
            else
              printf '[misc]\nhost_whitelist = %s\ninet_exposure = %s\n' \
                "${whitelist}" "${exposure}" > "${config_file}"
              exit 0
            fi

            awk -v whitelist="${whitelist}" -v exposure="${exposure}" '
              function missing_settings() {
                if (!found_whitelist) print "host_whitelist = " whitelist
                if (!found_exposure) print "inet_exposure = " exposure
              }
              /^\[misc\]$/ {
                in_misc = 1
                found_misc = 1
                print
                next
              }
              /^\[/ {
                if (in_misc) missing_settings()
                in_misc = 0
              }
              in_misc && /^host_whitelist *=/ {
                print "host_whitelist = " whitelist
                found_whitelist = 1
                next
              }
              in_misc && /^inet_exposure *=/ {
                print "inet_exposure = " exposure
                found_exposure = 1
                next
              }
              { print }
              END {
                if (in_misc) missing_settings()
                if (!found_misc) {
                  print ""
                  print "[misc]"
                  missing_settings()
                }
              }
            ' "${config_file}" > "${config_file}.tmp"
            mv "${config_file}.tmp" "${config_file}"
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/sabnzbd
          tag: "5.0.4"
        env:
          TZ: Europe/London
          PUID: "0"
          PGID: "0"
          UMASK: "002"
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8080
              initialDelaySeconds: 30
              periodSeconds: 20
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 1Gi

defaultPodOptions:
  automountServiceAccountToken: false
  hostname: sabnzbd
  nodeSelector:
    kubernetes.io/hostname: k8s-wrkr-03

service:
  app:
    controller: sabnzbd
    ports:
      http:
        port: 8080
        targetPort: 8080

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: local-path
    size: 2Gi
    globalMounts:
      - path: /config
  media:
    enabled: true
    existingClaim: media-library-pvc
    globalMounts:
      - path: /media
  downloads:
    enabled: true
    existingClaim: media-library-pvc
    globalMounts:
      - path: /downloads
        subPath: downloads/complete
  incomplete-downloads:
    enabled: true
    existingClaim: media-library-pvc
    globalMounts:
      - path: /incomplete-downloads
        subPath: downloads/incomplete
