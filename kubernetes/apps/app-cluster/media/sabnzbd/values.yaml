---
global:
  createDefaultServiceAccount: false

controllers:
  sabnzbd:
    strategy: RollingUpdate
    initContainers:
      whitelist-config:
        image:
          repository: docker.io/library/alpine
          tag: "3.24"
        command:
          - /bin/sh
          - -ec
        env:
          # Cap, not a fixed setting: cache_limit is only rewritten when it is
          # missing or larger than this, so a lower value chosen in the UI is
          # kept. Keep it at or below about a quarter of the app memory limit
          # (the article cache is anonymous memory, on top of ~250Mi baseline,
          # connection buffers and unpacking).
          CACHE_LIMIT_MAX_MB: "512"
        args:
          - |
            config_file="/config/sabnzbd.ini"
            whitelist="sabnzbd,sabnzbd.krapulax.dev,sabnzbd.krapulax.home,sabnzbd.media.svc.cluster.local"
            exposure=0

            mkdir -p /config

            if [ -f "${config_file}" ]; then
              exposure="$(awk '
                /^\[misc\][[:space:]]*$/ { in_misc = 1; next }
                /^\[/ { in_misc = 0 }
                in_misc && /^[[:space:]]*(username|password)[[:space:]]*=/ {
                  key = $0
                  sub(/[[:space:]]*=.*/, "", key)
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                  value = $0
                  sub(/^[^=]*=/, "", value)
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                  if (value ~ /^"[^"]*"$/ || value ~ /^\047[^\047]*\047$/) {
                    value = substr(value, 2, length(value) - 2)
                    gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                  }
                  if (key == "username" && value != "") username_set = 1
                  if (key == "password" && value != "") password_set = 1
                }
                END { print username_set && password_set ? 5 : 0 }
              ' "${config_file}")"
            else
              printf '[misc]\nhost_whitelist = %s\ninet_exposure = %s\ncache_limit = %sM\n' \
                "${whitelist}" "${exposure}" "${CACHE_LIMIT_MAX_MB}" > "${config_file}"
              exit 0
            fi

            # Parse the existing cache_limit (e.g. 1G, 450M, 512 M, bytes) to MiB.
            # Empty output means "not set". Rewrite only when unset or above the cap.
            cache_limit="$(awk -v cap="${CACHE_LIMIT_MAX_MB}" '
              /^\[misc\][[:space:]]*$/ { in_misc = 1; next }
              /^\[/ { in_misc = 0 }
              in_misc && /^[[:space:]]*cache_limit[[:space:]]*=/ {
                value = $0
                sub(/^[^=]*=/, "", value)
                gsub(/[[:space:]"\047]/, "", value)
                found = 1
                if (value == "") { rewrite = 1; next }
                if (match(value, /^[0-9]+(\.[0-9]+)?/) == 0) { rewrite = 1; next }
                number = substr(value, 1, RLENGTH) + 0
                unit = toupper(substr(value, RLENGTH + 1, 1))
                if (unit == "G") mb = number * 1024
                else if (unit == "M") mb = number
                else if (unit == "K") mb = number / 1024
                else if (unit == "T") mb = number * 1048576
                else mb = number / 1048576
                if (mb > cap) rewrite = 1
              }
              END { if (!found || rewrite) print cap "M" }
            ' "${config_file}")"

            awk -v whitelist="${whitelist}" -v exposure="${exposure}" -v cache_limit="${cache_limit}" '
              function missing_settings() {
                if (!found_whitelist) print "host_whitelist = " whitelist
                if (!found_exposure) print "inet_exposure = " exposure
                if (cache_limit != "" && !found_cache) print "cache_limit = " cache_limit
              }
              /^\[misc\]$/ {
                in_misc = 1
                found_misc = 1
                print
                next
              }
              /^\[/ {
                if (in_misc) missing_settings()
                in_misc = 0
              }
              in_misc && /^host_whitelist *=/ {
                print "host_whitelist = " whitelist
                found_whitelist = 1
                next
              }
              in_misc && /^inet_exposure *=/ {
                print "inet_exposure = " exposure
                found_exposure = 1
                next
              }
              in_misc && /^cache_limit *=/ {
                found_cache = 1
                if (cache_limit != "") { print "cache_limit = " cache_limit; next }
              }
              { print }
              END {
                if (in_misc) missing_settings()
                if (!found_misc) {
                  print ""
                  print "[misc]"
                  missing_settings()
                }
              }
            ' "${config_file}" > "${config_file}.tmp"
            mv "${config_file}.tmp" "${config_file}"
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/sabnzbd
          tag: "5.1.3"
        env:
          TZ: Europe/London
          PUID: "0"
          PGID: "0"
          UMASK: "002"
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8080
              initialDelaySeconds: 30
              periodSeconds: 20
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 2Gi

defaultPodOptions:
  automountServiceAccountToken: false
  hostname: sabnzbd
  nodeSelector:
    kubernetes.io/hostname: k8s-wrkr-03

service:
  app:
    controller: sabnzbd
    ports:
      http:
        port: 8080
        targetPort: 8080

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: local-path
    size: 2Gi
    globalMounts:
      - path: /config
  media:
    enabled: true
    existingClaim: media-library-pvc
    globalMounts:
      - path: /media
  downloads:
    enabled: true
    existingClaim: media-library-pvc
    globalMounts:
      - path: /downloads
        subPath: downloads/complete
  incomplete-downloads:
    enabled: true
    existingClaim: media-library-pvc
    globalMounts:
      - path: /incomplete-downloads
        subPath: downloads/incomplete
