---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: hermes-llm
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-apps
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: apps
  managedSecret:
    name: hermes-llm
    namespace: hermes
    type: Opaque
  secrets:
    - HERMES_LLM_ADDRESS
    - HERMES_LLM_MODEL
    - HERMES_LLM_API_KEY
