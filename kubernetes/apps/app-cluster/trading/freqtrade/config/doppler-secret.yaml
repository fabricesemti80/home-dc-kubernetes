---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: freqtrade-secrets
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-apps
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: apps
  managedSecret:
    name: freqtrade-secrets
    namespace: trading
    type: Opaque
  # Phase 1 (dry-run): no exchange keys. Live trading adds
  # FREQTRADE_EXCHANGE_KEY / FREQTRADE_EXCHANGE_SECRET in a separate PR.
  secrets:
    - FREQTRADE_UI_PASSWORD
    - FREQTRADE_JWT_SECRET
    - FREQTRADE_WS_TOKEN
    - FREQTRADE_LLM_API_KEY
