---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./doppler-secret.yaml
  - ./http-route-internal.yaml
  - ./pvc-data.yaml
# Fixed names: values.yaml mounts these ConfigMaps, and Reloader restarts
# the pod when they change.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: freqtrade-config
    namespace: trading
    files:
      - config.json
  - name: freqtrade-strategies
    namespace: trading
    files:
      - strategies/LlmTrendStrategy.py
