---
# Internal only: the FreqUI/API can force trades, so it is not exposed
# through the external gateway or the Cloudflare tunnel.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: freqtrade-internal
  namespace: trading
  annotations:
    external-dns.alpha.kubernetes.io/target: kubernetes.krapulax.home
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: http
  hostnames:
    - freqtrade.krapulax.home
  rules:
    - backendRefs:
        - name: freqtrade
          namespace: trading
          port: 8080
