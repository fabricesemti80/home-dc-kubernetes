---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: monitoring-remote-client-tls
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret-apps
    namespace: doppler-operator-system
  project: home-dc-kubernetes
  config: apps
  managedSecret:
    name: monitoring-remote-client-tls
    namespace: monitoring
    type: Opaque
  secrets:
    - MONITORING_REMOTE_CA_CERT
    - MONITORING_REMOTE_CLIENT_CERT
    - MONITORING_REMOTE_CLIENT_KEY
