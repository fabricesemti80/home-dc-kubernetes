---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: termix
  namespace: productivity
  annotations:
    external-dns.alpha.kubernetes.io/hostname: termix.krapulax.dev
    external-dns.alpha.kubernetes.io/target: external-apps.krapulax.dev
    gethomepage.dev/description: "Internal SSH and server access"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "App Cluster - productivity"
    gethomepage.dev/href: "https://termix.krapulax.dev"
    gethomepage.dev/icon: "terminal.png"
    gethomepage.dev/name: "Termix"
    gethomepage.dev/weight: "20"
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - termix.krapulax.dev
  rules:
    - backendRefs:
        - name: termix
          namespace: productivity
          port: 80
