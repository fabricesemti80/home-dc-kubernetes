apiVersion: v1
kind: ConfigMap
metadata:
  name: mkdocs-init-scripts
  namespace: productivity
data:
  init-docs.sh: |
    #!/bin/sh
    set -e

    DOCS_DIR="${DOCS_DIR:-/docs}"
    REPO_URL="${REPO_URL:-https://github.com/fabricesemti80/home-dc-kubernetes.git}"
    REPO_BRANCH="${REPO_BRANCH:-main}"
    GIT_DEPTH="${GIT_DEPTH:-1}"

    echo "🚀 Initializing mkdocs documentation..."
    echo "   Repository: $REPO_URL"
    echo "   Branch: $REPO_BRANCH"
    echo "   Target: $DOCS_DIR"

    # Create docs structure
    mkdir -p "$DOCS_DIR/docs"
    mkdir -p "$DOCS_DIR/docs/architecture"
    mkdir -p "$DOCS_DIR/docs/cluster"
    mkdir -p "$DOCS_DIR/docs/infrastructure"
    mkdir -p "$DOCS_DIR/docs/operations"
    mkdir -p "$DOCS_DIR/docs/storage"
    mkdir -p "$DOCS_DIR/docs/monitoring"
    mkdir -p "$DOCS_DIR/docs/plan"

    echo "📦 Cloning repository..."
    cd /tmp
    git clone --depth=$GIT_DEPTH --branch=$REPO_BRANCH --single-branch "$REPO_URL" repo-source
    
    # Copy mkdocs configuration
    echo "📝 Copying mkdocs configuration..."
    cp /mnt/seed/mkdocs.yml "$DOCS_DIR/"

    # Copy documentation from the repo's docs folder
    echo "📚 Copying documentation..."
    if [ -d "repo-source/docs" ]; then
      cp -r repo-source/docs/* "$DOCS_DIR/docs/" 2>/dev/null || true
      echo "   ✓ Copied docs/ folder"
    fi

    # Copy landing page
    echo "📄 Setting up landing page..."
    cp /mnt/seed/index.md "$DOCS_DIR/docs/"

    # List all directories
    echo "📋 Documentation structure:"
    find "$DOCS_DIR/docs" -maxdepth 1 -type d | sort | sed 's|.*/||' | grep -v '^$'

    # Count documentation files
    DOC_COUNT=$(find "$DOCS_DIR/docs" -name "*.md" | wc -l)
    echo "✅ Initialization complete! Found $DOC_COUNT documentation files"
