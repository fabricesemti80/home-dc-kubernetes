apiVersion: v1
kind: ConfigMap
metadata:
  name: mkdocs-docs-seed
  namespace: productivity
data:
  mkdocs.yml: |
    site_name: Home DC Docs
    site_description: Personal homelab documentation and cluster management
    site_author: Home DC
    
    theme:
      name: material
      language: en
      palette:
        - scheme: default
          primary: blue
          accent: indigo
          toggle:
            icon: material/lightbulb-outline
            name: Switch to dark mode
        - scheme: slate
          primary: blue
          accent: indigo
          toggle:
            icon: material/lightbulb
            name: Switch to light mode
      font:
        text: Roboto
        code: Roboto Mono
      features:
        - navigation.instant
        - navigation.instant.prefetch
        - navigation.instant.progress
        - navigation.tracking
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.expand
        - navigation.path
        - navigation.indices
        - toc.integrate
        - toc.follow
        - content.code.copy
        - content.code.select
        - content.tabs.link
        - content.tooltips
        - search.suggest
        - search.highlight
        - search.share
        - header.autohide
    
    markdown_extensions:
      - abbr
      - admonition
      - attr_list
      - def_list
      - footnotes
      - md_in_html
      - tables
      - toc:
          permalink: true
      - pymdownx.arithmatex:
          block_start_string: $$
          block_end_string: $$
          inline_start_string: $
          inline_end_string: $
      - pymdownx.betterem:
          smart_enable: all
      - pymdownx.caret
      - pymdownx.details
      - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
      - pymdownx.highlight:
          use_pygments: true
          anchor_linenums: true
          line_spans: __span
      - pymdownx.inlinehilite
      - pymdownx.keys
      - pymdownx.mark
      - pymdownx.snippets
      - pymdownx.superfences:
          custom_fences:
            - name: mermaid
              class: mermaid
              format: !!python/name:pymdownx.superfences.fence_code_format
      - pymdownx.tabbed:
          alternate_style: true
          combine_header_slug: true
      - pymdownx.tasklist:
          custom_checkbox: true
      - pymdownx.tilde
    
    plugins:
      - search:
          lang: en
      - minify:
          minify_html: true
          minify_css: true
          minify_js: true
    
    nav:
      - Home: index.md
      - Getting Started:
        - Installation: cluster/installation.md
        - Architecture: architecture/ARCHITECTURE_PLAN.md
        - Implementation Decisions: architecture/IMPLEMENTATION_DECISIONS.md
      - Infrastructure:
        - Terraform: infrastructure/terraform.md
        - Docker Stack: infrastructure/docker-stack.md
      - Cluster:
        - Cluster Overview: cluster/README.md
        - Adding Applications: cluster/adding-applications.md
        - Secret Strategy: cluster/secret-strategy.md
        - Dual-Cluster Management: cluster/dual-cluster-management.md
        - Domains: cluster/domains.md
        - Database Backups: cluster/database-backups.md
      - Storage:
        - Storage Overview: storage/overview.md
        - Media NFS: storage/media-nfs.md
        - Manual Setup: storage/manual-setup.md
        - Verification: storage/verification.md
      - Monitoring:
        - Uptime Kuma: monitoring/uptime-kuma-autokuma.md
      - Operations:
        - Troubleshooting: operations/troubleshooting.md
      - Architecture Docs:
        - Agents: architecture/AGENTS.md
        - Implementation Decisions: architecture/IMPLEMENTATION_DECISIONS.md
        - Media Management: architecture/MEDIA_MANAGEMENT_STACK.md
        - Home Assistant: architecture/home-assistant-deployment.md
      - Rollout Plans:
        - Media Management: plan/media-management-rollout.md
        - Immich Migration: plan/immich-migration.md
        - Etcd Stability: plan/etcd-stability-rollout.md
        - Technitium DNS: plan/technitium-infra-rollout.md
  index.md: |
    # 🏠 Home DC Kubernetes Documentation
    
    Welcome to the comprehensive documentation for the Home DC Kubernetes homelab infrastructure.
    
    ## 🚀 Quick Start
    
    New to the homelab? Start here:
    
    - [Installation & Deployment Guide](cluster/installation.md) — Bootstrap your Talos clusters
    - [Architecture Overview](architecture/ARCHITECTURE_PLAN.md) — Understand the design
    - [Implementation Decisions](architecture/IMPLEMENTATION_DECISIONS.md) — Design rationale
    
    ## 📚 Documentation Categories
    
    ### Infrastructure
    - **[Terraform Setup](infrastructure/terraform.md)** — IaC for infrastructure provisioning
    - **[Docker Stack](infrastructure/docker-stack.md)** — Container orchestration
    
    ### Kubernetes Cluster
    - **[Cluster Overview](cluster/README.md)** — Cluster architecture and components
    - **[Adding Applications](cluster/adding-applications.md)** — Deploy apps to the cluster
    - **[Secret Management](cluster/secret-strategy.md)** — Secure credential handling
    - **[Dual-Cluster Management](cluster/dual-cluster-management.md)** — Multi-cluster operations
    
    ### Storage & Media
    - **[Storage Architecture](storage/overview.md)** — PVC, NFS, and Ceph integration
    - **[Media NFS Share](storage/media-nfs.md)** — Shared media storage setup
    - **[Storage Verification](storage/verification.md)** — Validation and troubleshooting
    
    ### Operations
    - **[Troubleshooting Guide](operations/troubleshooting.md)** — Common issues and solutions
    - **[Monitoring Setup](monitoring/uptime-kuma-autokuma.md)** — Health checks and alerts
    
    ## 🎯 Current Projects
    
    Active rollout plans and migrations:
    
    - **[Media Management Stack](plan/media-management-rollout.md)** — Jellyfin, Radarr, Sonarr
    - **[Immich Migration](plan/immich-migration.md)** — Photo management system
    - **[Etcd Stability](plan/etcd-stability-rollout.md)** — Database optimization
    - **[Technitium DNS](plan/technitium-infra-rollout.md)** — DNS infrastructure
    
    ## 📖 How to Use This Documentation
    
    - **Use the navigation menu** (left sidebar) to browse by category
    - **Search** (top right) to find specific topics
    - **Dark mode toggle** (top right) for comfortable reading
    
    ## 🔗 Important Resources
    
    - [Repository](https://github.com/fabricesemti80/home-dc-kubernetes) — Source code and configurations
    - [Agents & Automation](AGENTS.md) — Automation rules and agent guidelines
