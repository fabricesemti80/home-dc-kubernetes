---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tailscale-infra-router
  namespace: network
  labels:
    app.kubernetes.io/name: tailscale-infra-router
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscale-infra-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailscale-infra-router
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: enable-forwarding
          image: busybox:1.37
          command:
            - sh
            - -c
            - sysctl -w net.ipv4.ip_forward=1 net.ipv6.conf.all.forwarding=1
          securityContext:
            privileged: true
      containers:
        - name: tailscale
          image: tailscale/tailscale:stable
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-infra-secrets
                  key: TAILSCALE_AUTHKEY
            - name: TS_ROUTES
              value: 10.0.0.0/16,192.168.0.0/16
            - name: TS_EXTRA_ARGS
              value: --advertise-exit-node
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_STATE_DIR
              value: /tmp/tailscale-state
            - name: TS_USERSPACE
              value: "false"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
            - name: tailscale-state
              mountPath: /tmp/tailscale-state
      tolerations:
        - operator: Exists
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: tailscale-state
          emptyDir: {}
