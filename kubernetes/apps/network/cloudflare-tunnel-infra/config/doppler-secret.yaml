---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: cloudflare-tunnel-infra-secrets
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret
    namespace: doppler-operator-system
  project: project-homelab
  config: dev_homelab
  managedSecret:
    name: cloudflare-tunnel-infra-secret
    namespace: network
  secrets:
    - TUNNEL_TOKEN_INFRA
  processors:
    TUNNEL_TOKEN_INFRA:
      asName: TUNNEL_TOKEN
