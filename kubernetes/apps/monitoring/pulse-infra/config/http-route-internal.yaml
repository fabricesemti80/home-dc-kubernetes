---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pulse-internal
  namespace: monitoring
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: http
  hostnames:
    - pulse.krapulax.home
    - pulse-infra.monitoring.svc.cluster.local
  rules:
    - backendRefs:
        - name: pulse
          namespace: monitoring
          port: 7655
