# Defaults only; per-cluster inventories live in kubernetes/apps/<cluster>/storage/app-protect/values.yaml
cluster: ""
image: python:3.15.1-slim@sha256:533b0b2f9b5d46fd097091cf826f27902f1d6c3bca714b6dc74551356aa97a51
nas:
  server: 10.0.40.2
  path: /k8s-backup
# Each app: name, namespace, schedule (cron, UTC), claim | hostPath, and where to run:
#   node      node-local volume (local-path, hostPath): pin the job to the node that holds the data;
#   selector  movable ReadWriteOnce volume (Longhorn): pod labels of the app, so the job runs on the
#             node where the app's pod (and therefore the attached volume) is. If both are set,
#             selector wins. hostPath apps must use node.
# optional: excludes (fnmatch on name or relative path), stageSize, tolerations,
# protect (default true; false opts out).
apps: []
