---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8up-app
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/fabricesemti80/home-dc-kubernetes.git
      path: kubernetes/apps/app-cluster/storage/k8up
      targetRevision: main
      ref: repo
    - repoURL: https://github.com/k8up-io/k8up.git
      path: charts/k8up
      # Chart 4.10.1.
      targetRevision: ff230b43ab8d73f3666219d748dea55bee036fdf
      helm:
        releaseName: k8up
        skipCrds: true
        valueFiles:
          - $repo/kubernetes/apps/app-cluster/storage/k8up/values.yaml
  destination:
    name: app-cluster
    namespace: backups
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
