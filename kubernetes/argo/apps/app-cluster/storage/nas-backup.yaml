---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nas-backup-app
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: kubernetes
  source:
    repoURL: https://github.com/fabricesemti80/home-dc-kubernetes.git
    path: kubernetes/apps/app-cluster/storage/nas-backup
    targetRevision: main
  destination:
    name: app-cluster
    namespace: backups
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
