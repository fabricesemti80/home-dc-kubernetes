---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vmagent-app
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/fabricesemti80/home-dc-kubernetes.git
      path: kubernetes/apps/app-cluster/monitoring/vmagent
      targetRevision: main
      ref: repo
    - repoURL: https://victoriametrics.github.io/helm-charts/
      chart: victoria-metrics-k8s-stack
      targetRevision: 0.97.0
      helm:
        releaseName: vmagent-app
        valueFiles:
          - $repo/kubernetes/apps/app-cluster/monitoring/vmagent/values.yaml
  destination:
    name: app-cluster
    namespace: monitoring
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
