apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mkdocs
  namespace: argo-system
spec:
  project: default
  sources:
    - repoURL: https://github.com/fabricesemti80/home-dc-kubernetes.git
      path: kubernetes/apps/app-cluster/productivity/mkdocs
      targetRevision: HEAD
      ref: repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.0.1
      helm:
        releaseName: mkdocs
        valueFiles:
          - $repo/kubernetes/apps/app-cluster/productivity/mkdocs/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: productivity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
