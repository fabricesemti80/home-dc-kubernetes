---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbootxyz
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: kubernetes
  sources:
    - repoURL: "https://github.com/fabricesemti80/home-dc-kubernetes.git"
      path: kubernetes/apps/infra-cluster/netboot/netbootxyz
      targetRevision: main
      ref: repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: netbootxyz
        valueFiles:
          - $repo/kubernetes/apps/infra-cluster/netboot/netbootxyz/values.yaml
  destination:
    name: infra-cluster
    namespace: netboot
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    retry:
      limit: 1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
