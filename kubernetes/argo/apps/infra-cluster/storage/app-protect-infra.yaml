---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-protect-infra
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: kubernetes
  source:
    repoURL: https://github.com/fabricesemti80/home-dc-kubernetes.git
    path: kubernetes/charts/app-protect
    targetRevision: main
    helm:
      releaseName: app-protect-infra
      valueFiles:
      - ../../apps/infra-cluster/storage/app-protect/values.yaml
  destination:
    name: infra-cluster
    namespace: backups
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - ServerSideApply=true
    - PruneLast=true
