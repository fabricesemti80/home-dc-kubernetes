---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbox
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: kubernetes
  sources:
    - repoURL: https://netbox-community.github.io/netbox-chart
      chart: netbox
      targetRevision: 8.3.49
      helm:
        releaseName: netbox
        valueFiles:
          - $repo/kubernetes/apps/infra-cluster/netbox/values.yaml
    - repoURL: "https://github.com/fabricesemti80/home-dc-kubernetes.git"
      path: kubernetes/apps/infra-cluster/netbox
      targetRevision: main
      ref: repo
  destination:
    name: infra-cluster
    namespace: netbox
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    retry:
      limit: 2
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true