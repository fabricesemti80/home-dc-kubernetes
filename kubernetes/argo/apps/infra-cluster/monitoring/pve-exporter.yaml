---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pve-exporter-infra
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/fabricesemti80/home-dc-kubernetes.git
      path: kubernetes/apps/infra-cluster/monitoring/pve-exporter
      targetRevision: main
      ref: repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.0.1
      helm:
        releaseName: pve-exporter
        valueFiles:
          - $repo/kubernetes/apps/infra-cluster/monitoring/pve-exporter/values.yaml
  destination:
    name: infra-cluster
    namespace: monitoring
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
