---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm-infra
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: kubernetes
  sources:
    - repoURL: https://github.com/BerriAI/litellm.git
      path: helm/litellm-helm
      targetRevision: v1.102.1
      helm:
        releaseName: litellm
        valueFiles:
          - $repo/kubernetes/apps/infra-cluster/ai/litellm/values.yaml
    - repoURL: "https://github.com/fabricesemti80/home-dc-kubernetes.git"
      targetRevision: main
      ref: repo
  destination:
    name: infra-cluster
    namespace: ai
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    retry:
      limit: 2
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
