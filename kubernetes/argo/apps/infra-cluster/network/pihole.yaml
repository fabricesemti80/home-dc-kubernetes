---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pihole
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: kubernetes
  sources:
    - repoURL: "https://github.com/fabricesemti80/home-dc-kubernetes.git"
      path: kubernetes/apps/infra-cluster/network/pihole
      targetRevision: main
      ref: repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.0.1
      helm:
        releaseName: pihole
        valueFiles:
          - $repo/kubernetes/apps/infra-cluster/network/pihole/values.yaml
  destination:
    name: infra-cluster
    namespace: network
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
