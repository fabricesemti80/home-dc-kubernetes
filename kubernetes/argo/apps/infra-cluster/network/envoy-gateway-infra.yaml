---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-infra
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: kubernetes
  sources:
    - repoURL: "https://github.com/fabricesemti80/home-dc-kubernetes.git"
      path: kubernetes/apps/infra-cluster/network/envoy-gateway-infra
      targetRevision: main
      ref: repo
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: 1.9.1
      helm:
        releaseName: envoy-gateway
  destination:
    name: infra-cluster
    namespace: network
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    retry:
      limit: 1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
