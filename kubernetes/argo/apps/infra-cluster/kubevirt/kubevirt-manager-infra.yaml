---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubevirt-manager-infra
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  project: kubernetes
  destination:
    name: infra-cluster
    namespace: kubevirt-manager
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    retry:
      limit: 2
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
  sources:
    - repoURL: https://github.com/fabricesemti80/home-dc-kubernetes.git
      targetRevision: main
      path: kubernetes/apps/infra-cluster/kubevirt/kubevirt-manager
      ref: repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.0.1
      helm:
        releaseName: kubevirt-manager
        valueFiles:
          - $repo/kubernetes/apps/infra-cluster/kubevirt/kubevirt-manager/values.yaml
