---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubevirt-runtime-infra
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  project: kubernetes
  source:
    repoURL: https://github.com/fabricesemti80/home-dc-kubernetes.git
    targetRevision: main
    path: kubernetes/apps/infra-cluster/kubevirt/kubevirt-runtime
  destination:
    name: infra-cluster
    namespace: kubevirt
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    retry:
      limit: 2
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
