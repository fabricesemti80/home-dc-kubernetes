---
version: '3'

vars:
  TF_CLOUDFLARE_DIR: '{{.ROOT_DIR}}/infra/terraform_cloudflare'
  TF_LOCALDNS_DIR: '{{.ROOT_DIR}}/infra/terraform_localdns'

tasks:

  argo-sync-bootstrap:
    desc: Apply the Argo CD app-of-apps bootstrap resources
    cmds:
      - kubectl --namespace argo-system apply --server-side --filename {{.ROOT_DIR}}/kubernetes/components/common/settings.yaml
      - kubectl --namespace argo-system apply --server-side --filename {{.ROOT_DIR}}/kubernetes/components/common/repositories.yaml
      - kubectl --namespace argo-system apply --server-side --filename {{.ROOT_DIR}}/kubernetes/components/common/apps.yaml
    preconditions:
      - test -f {{.KUBECONFIG}}
      - test -f {{.ROOT_DIR}}/kubernetes/components/common/apps.yaml
      - test -f {{.ROOT_DIR}}/kubernetes/components/common/repositories.yaml
      - test -f {{.ROOT_DIR}}/kubernetes/components/common/settings.yaml
      - which kubectl

  argo-reconcile:
    desc: Request a hard refresh of all Argo CD Applications
    deps: [argo-sync-bootstrap]
    cmd: kubectl --namespace argo-system annotate applications.argoproj.io --all argocd.argoproj.io/refresh=hard --overwrite
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which kubectl

  platform-cilium:
    desc: Install and validate Cilium
    deps: [argo-sync-bootstrap]
    cmds:
      - kubectl --namespace argo-system get applications.argoproj.io cilium
      - kubectl --namespace kube-system rollout status daemonset/cilium --timeout=5m

  platform-ingress:
    desc: Validate the Envoy Gateway ingress path
    deps: [argo-sync-bootstrap]
    cmds:
      - kubectl --namespace argo-system get applications.argoproj.io envoy-gateway
      - kubectl --namespace network rollout status deployment/envoy-gateway --timeout=5m

  platform-argocd:
    desc: Install and validate Argo CD
    task: argo-sync-bootstrap

  platform-observability:
    desc: Install observability stack
    deps: [argo-sync-bootstrap]
    cmd: kubectl --namespace argo-system get applications.argoproj.io kube-prometheus-stack

  verify:
    desc: Run post-bootstrap verification checks
    cmds:
      - kubectl get nodes -o wide
      - talosctl --talosconfig {{.TALOSCONFIG}} health
    preconditions:
      - test -f {{.KUBECONFIG}}
      - test -f {{.TALOSCONFIG}}
      - which kubectl talosctl

  tf-init:
    desc: Initialize all OpenTofu stacks in execution order
    cmds:
      - task: tf-cloudflare-init
      - task: tf-localdns-init

  tf-plan:
    desc: Plan all OpenTofu stacks in execution order
    cmds:
      - task: tf-cloudflare-plan
      - task: tf-localdns-plan

  tf-apply:
    desc: Apply all OpenTofu stacks in execution order
    cmds:
      - task: tf-cloudflare-apply
      - task: tf-localdns-apply

  tf-destroy:
    desc: Destroy all OpenTofu stacks in reverse dependency order
    cmds:
      - task: tf-localdns-destroy
      - task: tf-cloudflare-destroy

  tf-cloudflare-init:
    desc: Initialize the Cloudflare OpenTofu stack
    cmd: doppler run --project home-dc-kubernetes --config "${CLOUDFLARE_DOPPLER_CONFIG:?Set CLOUDFLARE_DOPPLER_CONFIG}" --name-transformer tf-var -- tofu -chdir={{.TF_CLOUDFLARE_DIR}} init -upgrade
    preconditions:
      - which doppler tofu

  tf-cloudflare-plan:
    desc: Plan the Cloudflare OpenTofu stack
    cmd: doppler run --project home-dc-kubernetes --config "${CLOUDFLARE_DOPPLER_CONFIG:?Set CLOUDFLARE_DOPPLER_CONFIG}" --name-transformer tf-var -- tofu -chdir={{.TF_CLOUDFLARE_DIR}} plan -out=tfplan
    preconditions:
      - which doppler tofu
      - test -d {{.TF_CLOUDFLARE_DIR}}/.terraform

  tf-cloudflare-migrate-doppler-state:
    desc: Rebind legacy project-homelab Doppler state to home-dc-kubernetes
    cmd: doppler run --project home-dc-kubernetes --config "${CLOUDFLARE_DOPPLER_CONFIG:?Set CLOUDFLARE_DOPPLER_CONFIG}" --name-transformer tf-var -- bash {{.ROOT_DIR}}/scripts/migrate-cloudflare-doppler-state.sh
    preconditions:
      - which doppler tofu jq
      - test -d {{.TF_CLOUDFLARE_DIR}}/.terraform
      - test -f {{.TF_CLOUDFLARE_DIR}}/terraform.tfstate

  tf-cloudflare-apply:
    desc: Apply the Cloudflare OpenTofu stack
    cmds:
      - doppler run --project home-dc-kubernetes --config "${CLOUDFLARE_DOPPLER_CONFIG:?Set CLOUDFLARE_DOPPLER_CONFIG}" --name-transformer tf-var -- tofu -chdir={{.TF_CLOUDFLARE_DIR}} plan -out=tfplan
      - doppler run --project home-dc-kubernetes --config "${CLOUDFLARE_DOPPLER_CONFIG:?Set CLOUDFLARE_DOPPLER_CONFIG}" --name-transformer tf-var -- tofu -chdir={{.TF_CLOUDFLARE_DIR}} apply tfplan
    preconditions:
      - which doppler tofu
      - test -d {{.TF_CLOUDFLARE_DIR}}/.terraform

  tf-cloudflare-destroy:
    desc: Destroy the Cloudflare OpenTofu stack
    cmd: doppler run --project home-dc-kubernetes --config "${CLOUDFLARE_DOPPLER_CONFIG:?Set CLOUDFLARE_DOPPLER_CONFIG}" --name-transformer tf-var -- tofu -chdir={{.TF_CLOUDFLARE_DIR}} destroy -auto-approve
    preconditions:
      - which doppler tofu
      - test -d {{.TF_CLOUDFLARE_DIR}}/.terraform

  tf-localdns-init:
    desc: Initialize the local DNS OpenTofu stack when populated
    cmd: |
      if find {{.TF_LOCALDNS_DIR}} -maxdepth 1 -name '*.tf' | grep -q .; then
        doppler run --project home-dc-kubernetes --config infra --name-transformer tf-var -- tofu -chdir={{.TF_LOCALDNS_DIR}} init -upgrade
      else
        echo "No localdns OpenTofu files yet; skipping init."
      fi
    preconditions:
      - which doppler tofu

  tf-localdns-plan:
    desc: Plan the local DNS OpenTofu stack when populated
    cmd: |
      if find {{.TF_LOCALDNS_DIR}} -maxdepth 1 -name '*.tf' | grep -q .; then
        doppler run --project home-dc-kubernetes --config infra --name-transformer tf-var -- tofu -chdir={{.TF_LOCALDNS_DIR}} plan -out=tfplan
      else
        echo "No localdns OpenTofu files yet; skipping plan."
      fi
    preconditions:
      - which doppler tofu

  tf-localdns-apply:
    desc: Apply the local DNS OpenTofu stack when populated
    cmd: |
      if find {{.TF_LOCALDNS_DIR}} -maxdepth 1 -name '*.tf' | grep -q .; then
        doppler run --project home-dc-kubernetes --config infra --name-transformer tf-var -- tofu -chdir={{.TF_LOCALDNS_DIR}} plan -out=tfplan
        doppler run --project home-dc-kubernetes --config infra --name-transformer tf-var -- tofu -chdir={{.TF_LOCALDNS_DIR}} apply tfplan
      else
        echo "No localdns OpenTofu files yet; skipping apply."
      fi
    preconditions:
      - which doppler tofu

  tf-localdns-destroy:
    desc: Destroy the local DNS OpenTofu stack when populated
    cmd: |
      if find {{.TF_LOCALDNS_DIR}} -maxdepth 1 -name '*.tf' | grep -q .; then
        doppler run --project home-dc-kubernetes --config infra --name-transformer tf-var -- tofu -chdir={{.TF_LOCALDNS_DIR}} destroy -auto-approve
      else
        echo "No localdns OpenTofu files yet; skipping destroy."
      fi
    preconditions:
      - which doppler tofu
