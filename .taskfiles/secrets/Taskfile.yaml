---
version: '3'

tasks:

  validate-bootstrap:
    desc: Validate local SOPS/age inputs and secret-manager references before cluster bootstrap
    cmd: bash {{.ROOT_DIR}}/scripts/validate-secret-bootstrap.sh
    preconditions:
      - test -f {{.ROOT_DIR}}/scripts/validate-secret-bootstrap.sh
      - which age-keygen jq sops

  argo-rotate:
    desc: Rotate the Argo CD admin password and webhook secret into the SOPS-encrypted values file
    cmd: uv run --script {{.ROOT_DIR}}/scripts/rotate-argo-secrets.py rotate
    preconditions:
      - which uv sops

  argo-sync-webhook:
    desc: Set the GitHub webhook secret from the encrypted Argo CD values (run after Argo syncs)
    cmd: uv run --script {{.ROOT_DIR}}/scripts/rotate-argo-secrets.py sync-webhook
    preconditions:
      - which uv sops gh
