---
version: '3'

tasks:

  talos:
    desc: Bootstrap the Talos cluster
    dir: '{{.TALOS_DIR}}'
    cmds:
      - '[ -f talsecret.sops.yaml ] || talhelper gensecret | sops --filename-override talos/app/talsecret.sops.yaml --encrypt /dev/stdin > talsecret.sops.yaml'
      - talhelper genconfig
      - talhelper gencommand apply --extra-flags="--insecure" | bash
      - until talhelper gencommand bootstrap | bash; do sleep 10; done
      - until talhelper gencommand kubeconfig --extra-flags="{{.ROOT_DIR}} --force" | bash; do sleep 10; done
    preconditions:
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.TALOS_DIR}}/talconfig.yaml
      - which talhelper talosctl sops

  network:
    desc: Install Cilium before the fresh cluster can report Ready nodes
    cmd: bash {{.SCRIPTS_DIR}}/bootstrap-apps.sh network
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which helmfile kubectl

  platform:
    desc: Install bootstrap platform charts without syncing Argo Applications
    cmd: bash {{.SCRIPTS_DIR}}/bootstrap-apps.sh platform
    preconditions:
      - msg: Bash 4 or newer is required
        sh: "bash -c '(( BASH_VERSINFO[0] >= 4 ))'"
      - test -f {{.KUBECONFIG}}
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SCRIPTS_DIR}}/bootstrap-apps.sh
      - test -f {{.SOPS_AGE_KEY_FILE}}

  apps:
    desc: Sync merged Argo Applications with the webhook-only public tunnel gate
    cmd: bash {{.SCRIPTS_DIR}}/bootstrap-apps.sh all
    preconditions:
      - msg: Bash 4 or newer is required
        sh: "bash -c '(( BASH_VERSINFO[0] >= 4 ))'"
      - test -f {{.KUBECONFIG}}
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SCRIPTS_DIR}}/bootstrap-apps.sh
      - test -f {{.SOPS_AGE_KEY_FILE}}
