---
version: '3'

tasks:
  photos-prepare:
    desc: Create only the empty private-metadata mountpoint in the existing Immich subtree
    cmd: python3 '{{.ROOT_DIR}}/scripts/backup_photos.py' prepare

  photos-seed:
    desc: Seed scoped originals with transaction-matched DB metadata; not a paused recovery-set acceptance
    cmd: python3 '{{.ROOT_DIR}}/scripts/backup_photos.py' seed

  photos-verify:
    desc: Restore one immutable photo seed in isolation and verify every DB-referenced original
    requires:
      vars: [SNAPSHOT]
    cmd: python3 '{{.ROOT_DIR}}/scripts/backup_photos.py' verify --snapshot '{{.SNAPSHOT}}'

  pilot-photo-set:
    desc: Prove one native snapshot contains originals and private init metadata without source writes
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    cmd: python3 '{{.ROOT_DIR}}/scripts/pilot-k8up-photo-set.py' '{{.CLUSTER}}'

  alerts-bootstrap:
    desc: Reuse the existing monitoring Slack route for both database policies
    cmd: python3 '{{.ROOT_DIR}}/scripts/backup-policy.py' alerts-bootstrap

  policy-verify:
    desc: Validate the actual rendered GitOps protection resources against the destination API
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    cmd: python3 '{{.ROOT_DIR}}/scripts/backup-policy.py' verify '{{.CLUSTER}}'

  policy-smoke:
    desc: Deliver a real missing-source alert followed by recovery using the GitOps auditor template
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    cmd: python3 '{{.ROOT_DIR}}/scripts/backup-policy.py' smoke '{{.CLUSTER}}'

  audit:
    desc: Audit actual database recovery coverage and deliver the current status to Slack
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    cmd: python3 '{{.ROOT_DIR}}/scripts/backup-policy.py' audit '{{.CLUSTER}}'

  check-data:
    desc: Run the GitOps full repository data-check template once without breaking locks
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    cmd: python3 '{{.ROOT_DIR}}/scripts/backup-policy.py' check-data '{{.CLUSTER}}'

  recover:
    desc: Recover an exact database snapshot and KEEP its verified isolated database for reviewed promotion
    requires:
      vars: [CLUSTER, APP, SNAPSHOT]
    vars:
      TARGET_CLUSTER: '{{.TARGET_CLUSTER | default .CLUSTER}}'
    cmd: python3 '{{.ROOT_DIR}}/scripts/backup_apps.py' restore '{{.APP}}' --cluster '{{.CLUSTER}}' --snapshot '{{.SNAPSHOT}}' --target-cluster '{{.TARGET_CLUSTER}}' --keep-target

  prove:
    desc: Capture one real app and verify independent recovery onto fresh isolated storage
    requires:
      vars: [CLUSTER, APP]
    cmd: python3 '{{.ROOT_DIR}}/scripts/backup_apps.py' prove '{{.APP}}' --cluster '{{.CLUSTER}}'

  run:
    desc: Capture one real app into its durable encrypted repository
    requires:
      vars: [CLUSTER, APP]
    cmd: python3 '{{.ROOT_DIR}}/scripts/backup_apps.py' capture '{{.APP}}' --cluster '{{.CLUSTER}}'

  restore:
    desc: Drill an exact recovery point and erase only the newly created disposable target
    requires:
      vars: [CLUSTER, APP, SNAPSHOT]
    vars:
      TARGET_CLUSTER: '{{.TARGET_CLUSTER | default .CLUSTER}}'
    cmd: python3 '{{.ROOT_DIR}}/scripts/backup_apps.py' restore '{{.APP}}' --cluster '{{.CLUSTER}}' --snapshot '{{.SNAPSHOT}}' --target-cluster '{{.TARGET_CLUSTER}}'

  postgres-credentials-bootstrap:
    desc: Provision and authenticate the marked read-only PostgreSQL backup login
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    cmd: python3 '{{.ROOT_DIR}}/scripts/bootstrap-postgres-backup.py' '{{.CLUSTER}}'

  keys-bootstrap:
    desc: Establish repository key in Doppler and independent macOS Keychain without rotation
    requires:
      vars: [CLUSTER, NAMESPACE, PROFILE]
    cmd: python3 '{{.ROOT_DIR}}/scripts/backup-keys.py' bootstrap '{{.CLUSTER}}' '{{.NAMESPACE}}' '{{.PROFILE}}'

  keys-verify:
    desc: Compare repository key copies without printing credentials
    requires:
      vars: [CLUSTER, NAMESPACE, PROFILE]
    cmd: python3 '{{.ROOT_DIR}}/scripts/backup-keys.py' verify '{{.CLUSTER}}' '{{.NAMESPACE}}' '{{.PROFILE}}'

  pilot-postgres:
    desc: Prove synthetic PostgreSQL K8up capture, independent import and failure rejection
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
        - name: MAJOR
          enum: ["14", "17"]
    cmd: python3 '{{.ROOT_DIR}}/scripts/pilot-k8up-postgres.py' '{{.CLUSTER}}' --major '{{.MAJOR}}'

  pilot-files:
    desc: Test synthetic K8up file backup and cross-node restore without enrolling apps
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    cmd: python3 '{{.ROOT_DIR}}/scripts/pilot-k8up-files.py' '{{.CLUSTER}}'

  operator-bootstrap:
    desc: Register a K8up Application with Argo and verify its destination operator
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    vars:
      REVISION: '{{.REVISION | default "main"}}'
    cmd: python3 '{{.ROOT_DIR}}/scripts/k8up-operator.py' bootstrap '{{.CLUSTER}}' --revision '{{.REVISION}}'

  operator-status:
    desc: Show Argo and runtime status for one cluster's K8up operator
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    cmd: python3 '{{.ROOT_DIR}}/scripts/k8up-operator.py' status '{{.CLUSTER}}'

  operator-verify:
    desc: Verify protected CRDs, operator configuration and live metrics
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    vars:
      EXPECT_IDLE: '{{.EXPECT_IDLE | default "false"}}'
    cmd: python3 '{{.ROOT_DIR}}/scripts/k8up-operator.py' verify '{{.CLUSTER}}' {{if eq .EXPECT_IDLE "true"}}--expect-idle{{end}}

  status:
    desc: Show the NAS target and probe jobs in one explicitly selected cluster
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    vars:
      TARGET_KUBECONFIG: '{{if eq .CLUSTER "app-cluster"}}{{.ROOT_DIR}}/kubeconfig{{else}}{{.ROOT_DIR}}/.private/infra-cluster/kubeconfig{{end}}'
    cmds:
      - kubectl --kubeconfig '{{.TARGET_KUBECONFIG}}' -n backups get pvc k8s-backup
      - kubectl --kubeconfig '{{.TARGET_KUBECONFIG}}' -n backups get jobs -l app.kubernetes.io/name=backup-target-probe

  access-check:
    desc: Require UID 1004 backup/restore success and unrelated UID write denial
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    cmds:
      - task: smoke
        vars:
          CLUSTER: '{{.CLUSTER}}'
      - python3 '{{.ROOT_DIR}}/scripts/check-backup-target.py' '{{.CLUSTER}}' --uid 65534 --gid 65534 --expect-denied

  smoke:
    desc: Verify an encrypted Restic backup and byte-identical restore on the NAS target
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    cmd: python3 '{{.ROOT_DIR}}/scripts/check-backup-target.py' '{{.CLUSTER}}'
