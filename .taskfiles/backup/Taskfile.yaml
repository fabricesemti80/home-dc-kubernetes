---
version: '3'

tasks:
  pilot-files:
    desc: Test synthetic K8up file backup and cross-node restore without enrolling apps
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    cmd: python3 '{{.ROOT_DIR}}/scripts/pilot-k8up-files.py' '{{.CLUSTER}}'

  operator-bootstrap:
    desc: Register a K8up Application with Argo and verify its destination operator
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    vars:
      REVISION: '{{.REVISION | default "main"}}'
    cmd: python3 '{{.ROOT_DIR}}/scripts/k8up-operator.py' bootstrap '{{.CLUSTER}}' --revision '{{.REVISION}}'

  operator-status:
    desc: Show Argo and runtime status for one cluster's K8up operator
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    cmd: python3 '{{.ROOT_DIR}}/scripts/k8up-operator.py' status '{{.CLUSTER}}'

  operator-verify:
    desc: Verify protected CRDs, operator configuration and live metrics
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    vars:
      EXPECT_IDLE: '{{.EXPECT_IDLE | default "false"}}'
    cmd: python3 '{{.ROOT_DIR}}/scripts/k8up-operator.py' verify '{{.CLUSTER}}' {{if eq .EXPECT_IDLE "true"}}--expect-idle{{end}}

  status:
    desc: Show the NAS target and probe jobs in one explicitly selected cluster
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    vars:
      TARGET_KUBECONFIG: '{{if eq .CLUSTER "app-cluster"}}{{.ROOT_DIR}}/kubeconfig{{else}}{{.ROOT_DIR}}/.private/infra-cluster/kubeconfig{{end}}'
    cmds:
      - kubectl --kubeconfig '{{.TARGET_KUBECONFIG}}' -n backups get pvc k8s-backup
      - kubectl --kubeconfig '{{.TARGET_KUBECONFIG}}' -n backups get jobs -l app.kubernetes.io/name=backup-target-probe

  access-check:
    desc: Require UID 1004 backup/restore success and unrelated UID write denial
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    cmds:
      - task: smoke
        vars:
          CLUSTER: '{{.CLUSTER}}'
      - python3 '{{.ROOT_DIR}}/scripts/check-backup-target.py' '{{.CLUSTER}}' --uid 65534 --gid 65534 --expect-denied

  smoke:
    desc: Verify an encrypted Restic backup and byte-identical restore on the NAS target
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    cmd: python3 '{{.ROOT_DIR}}/scripts/check-backup-target.py' '{{.CLUSTER}}'
