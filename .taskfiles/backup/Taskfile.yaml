---
version: '3'

vars:
  TARGET_KUBECONFIG: '{{if eq .CLUSTER "infra-cluster"}}{{.ROOT_DIR}}/.private/infra-cluster/kubeconfig{{else}}{{.ROOT_DIR}}/kubeconfig{{end}}'

tasks:
  credentials:
    desc: Verify Backrest credentials and independent key escrow, then provision the read-only DB login
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    cmds:
      - uv run '{{.ROOT_DIR}}/scripts/backrest-secrets.py' '{{.CLUSTER}}'
      - python3 '{{.ROOT_DIR}}/scripts/bootstrap-postgres-backup.py' '{{.CLUSTER}}'

  bootstrap:
    desc: Register the GitOps Backrest Application (main by default)
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
    vars:
      REVISION: '{{.REVISION | default "main"}}'
    env:
      REVISION: '{{.REVISION}}'
    cmds:
      - task: credentials
      - yq '.spec.sources[0].targetRevision = strenv(REVISION)' '{{.ROOT_DIR}}/kubernetes/argo/apps/{{.CLUSTER}}/storage/backrest.yaml' | kubectl --kubeconfig '{{.ROOT_DIR}}/kubeconfig' apply -f -

  status:
    desc: Show actual Backrest operations; queued is not completed
    requires:
      vars: [CLUSTER]
    cmds:
      - kubectl --kubeconfig '{{.TARGET_KUBECONFIG}}' -n backups get deployment/backrest,pvc/backrest,pvc/k8s-backup
      - python3 '{{.ROOT_DIR}}/scripts/backrest.py' status '{{.CLUSTER}}'

  export:
    desc: Publish one validated native DB archive from the deployed CronJob template
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
        - name: APP
          enum: [immich-db, litellm-db]
    vars:
      JOB: 'backrest-export-manual-{{now | date "20060102150405"}}'
    cmds:
      - kubectl --kubeconfig '{{.TARGET_KUBECONFIG}}' -n backups create job '{{.JOB}}' --from=cronjob/backrest-export-{{.APP}}
      - kubectl --kubeconfig '{{.TARGET_KUBECONFIG}}' -n backups wait --for=condition=Complete job/{{.JOB}} --timeout=1000s

  run:
    desc: Queue a native Backrest plan; inspect completion in status or the UI
    requires:
      vars: [CLUSTER, PLAN]
    cmd: python3 '{{.ROOT_DIR}}/scripts/backrest.py' run '{{.CLUSTER}}' --plan '{{.PLAN}}'

  snapshots:
    desc: List immutable recovery points for a plan
    requires:
      vars: [CLUSTER, PLAN]
    cmd: python3 '{{.ROOT_DIR}}/scripts/backrest.py' snapshots '{{.CLUSTER}}' --plan '{{.PLAN}}'

  restore:
    desc: Queue an exact snapshot restore into a fresh NAS directory, never production
    requires:
      vars: [CLUSTER, PLAN, SNAPSHOT]
    cmd: python3 '{{.ROOT_DIR}}/scripts/backrest.py' restore '{{.CLUSTER}}' --plan '{{.PLAN}}' --snapshot '{{.SNAPSHOT}}'

  check:
    desc: Queue the native repository data integrity check
    requires:
      vars: [CLUSTER]
    cmd: python3 '{{.ROOT_DIR}}/scripts/backrest.py' check '{{.CLUSTER}}'

  ui:
    desc: Open a private loopback tunnel to the authenticated Backrest UI
    requires:
      vars: [CLUSTER]
    cmd: kubectl --kubeconfig '{{.TARGET_KUBECONFIG}}' -n backups port-forward deployment/backrest 9898:9898 --address=127.0.0.1

  retire-k8up:
    desc: After real Backrest restores and DB imports, remove legacy K8up and its enumerated NAS repositories
    requires:
      vars:
        - name: CLUSTER
          enum: [app-cluster, infra-cluster]
        - name: DATABASE_IMPORTS_VERIFIED
          enum: ['yes']
    cmd: python3 '{{.ROOT_DIR}}/scripts/retire-k8up.py' '{{.CLUSTER}}' --database-imports-verified

  target-smoke:
    desc: Verify an encrypted disposable backup and byte-identical restore on the NAS
    requires:
      vars: [CLUSTER]
    cmd: python3 '{{.ROOT_DIR}}/scripts/check-backup-target.py' '{{.CLUSTER}}'
