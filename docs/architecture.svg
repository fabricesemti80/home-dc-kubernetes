<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kubernetes-architecture-title kubernetes-architecture-desc" id="kubernetes-architecture-root">
        <title id="kubernetes-architecture-title">Kubernetes GitOps overview</title>
        <desc id="kubernetes-architecture-desc">The home-dc-kubernetes repository supplies Talos bootstrap and GitOps manifests. Argo CD runs on the one-controller, three-worker app cluster and manages the separate two-node physical infra cluster; Cloudflare tunnels and NAS media are external dependencies.</desc>
        <defs>
      <style>#kubernetes-architecture-root { --color-paper: #f5f5f5; --color-paper-2: #ececec; --color-ink: #2d3142;
      --color-muted: #4f5d75; --color-soft: #5a6580; --color-rule: rgba(45,49,66,.12);
      --color-rule-solid: #bfc0c0; --color-accent: #bf4520;
      --color-accent-tint: rgba(191,69,32,.08); --color-link: #2e5aa8;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      @media (prefers-color-scheme: dark) {
#kubernetes-architecture-root { --color-paper: #2d3142; --color-paper-2: #393e53; --color-ink: #f5f5f5;
        --color-muted: #bfc0c0; --color-soft: #949eb2; --color-rule: rgba(245,245,245,.12);
        --color-rule-solid: rgba(191,192,192,.25); --color-accent: #f08a59;
        --color-accent-tint: rgba(240,138,89,.10); --color-link: #739fdf; }
}
      #kubernetes-architecture-root { color: var(--color-ink); font-family: var(--font-sans); }
      #kubernetes-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#kubernetes-architecture-root .diagram-container { overflow-x: visible; }
}
      #kubernetes-architecture-root .page-title { font: 400 28px/1.15 var(--font-serif); fill: var(--color-ink); }
      #kubernetes-architecture-root .page-subtitle { font: 400 12px var(--font-sans); fill: var(--color-muted); }
      #kubernetes-architecture-root .zone { fill: none; stroke: var(--color-rule-solid); stroke-width: .8; stroke-dasharray: 4 4; }
      #kubernetes-architecture-root .zone-mask { fill: var(--color-paper); }
      #kubernetes-architecture-root .zone-label { font: 500 8px var(--font-mono); letter-spacing: .14em; fill: var(--color-soft); }
      #kubernetes-architecture-root .control { fill: none; stroke: var(--color-muted); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
      #kubernetes-architecture-root .service { fill: none; stroke: var(--color-link); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
      #kubernetes-architecture-root .node { fill: var(--color-paper); stroke: var(--color-rule-solid); stroke-width: 1; }
      #kubernetes-architecture-root .node-focal { fill: var(--color-accent-tint); stroke: var(--color-accent); stroke-width: 1.2; }
      #kubernetes-architecture-root .node-external { fill: var(--color-paper-2); stroke: var(--color-rule-solid); stroke-width: 1; }
      #kubernetes-architecture-root .tag-box { fill: none; stroke: var(--color-rule-solid); stroke-width: .8; }
      #kubernetes-architecture-root .tag-box-focal { fill: none; stroke: var(--color-accent); stroke-width: .8; }
      #kubernetes-architecture-root .tag { font: 500 7px var(--font-mono); letter-spacing: .1em; fill: var(--color-muted); }
      #kubernetes-architecture-root .tag-focal { font: 500 7px var(--font-mono); letter-spacing: .1em; fill: var(--color-accent); }
      #kubernetes-architecture-root .node-name { font: 600 12px var(--font-sans); fill: var(--color-ink); }
      #kubernetes-architecture-root .sublabel { font: 400 9px var(--font-mono); fill: var(--color-soft); }
      #kubernetes-architecture-root .legend { font: 400 8px var(--font-mono); fill: var(--color-muted); letter-spacing: .04em; }</style>
          <marker id="kubernetes-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="var(--color-muted)"/></marker>
          <marker id="kubernetes-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="var(--color-link)"/></marker>
        </defs>

        <text x="40" y="32" class="eyebrow">HOME DC KUBERNETES · TALOS + GITOPS</text>
        <text x="40" y="70" class="page-title">One GitOps hub, two Talos clusters</text>
        <text x="40" y="96" class="page-subtitle">This repo owns bootstrap and manifests; OpenTofu owns app-cluster VMs, while Argo CD manages both clusters.</text>

        <g>
          <rect x="40" y="128" width="216" height="392" rx="8" class="zone"/>
          <rect x="280" y="128" width="320" height="392" rx="8" class="zone"/>
          <rect x="624" y="128" width="296" height="392" rx="8" class="zone"/>
          <rect x="52" y="132" width="92" height="14" rx="2" class="zone-mask"/>
          <text x="98" y="142" text-anchor="middle" class="zone-label">SOURCE</text>
          <rect x="292" y="132" width="112" height="14" rx="2" class="zone-mask"/>
          <text x="348" y="142" text-anchor="middle" class="zone-label">APP CLUSTER</text>
          <rect x="636" y="132" width="204" height="14" rx="2" class="zone-mask"/>
          <text x="738" y="142" text-anchor="middle" class="zone-label">EDGE + PHYSICAL INFRA</text>
        </g>

        <g>
          <path d="M148 264 V360" class="control" marker-end="url(#kubernetes-architecture-arrow)"/>
          <path d="M240 220 H312" class="control" marker-end="url(#kubernetes-architecture-arrow)"/>
          <path d="M240 400 H312" class="control" marker-end="url(#kubernetes-architecture-arrow)"/>
          <path d="M440 256 V344" class="control" marker-end="url(#kubernetes-architecture-arrow)"/>
          <path d="M568 220 H592 Q600 220 600 228 V392 Q600 400 608 400 H648" class="control" marker-end="url(#kubernetes-architecture-arrow)"/>
          <path d="M648 216 H628 Q620 216 620 224 V368 Q620 376 612 376 H568" class="service" marker-end="url(#kubernetes-architecture-arrow-link)"/>
          <path d="M772 256 V344" class="service" marker-end="url(#kubernetes-architecture-arrow-link)"/>
          <path d="M568 432 H600 Q608 432 608 440 V488 Q608 496 616 496 H648" class="service" marker-end="url(#kubernetes-architecture-arrow-link)"/>
        </g>
        <g>
          <rect x="156" y="308" width="60" height="12" rx="2" class="zone-mask"/>
          <text x="186" y="317" text-anchor="middle" class="legend">BOOTSTRAP</text>
          <rect x="248" y="200" width="48" height="12" rx="2" class="zone-mask"/>
          <text x="272" y="209" text-anchor="middle" class="legend">GITOPS</text>
          <rect x="248" y="380" width="44" height="12" rx="2" class="zone-mask"/>
          <text x="270" y="389" text-anchor="middle" class="legend">TALOS</text>
          <rect x="448" y="292" width="28" height="12" rx="2" class="zone-mask"/>
          <text x="462" y="301" text-anchor="middle" class="legend">APP</text>
          <rect x="576" y="380" width="48" height="12" rx="2" class="zone-mask"/>
          <text x="600" y="389" text-anchor="middle" class="legend">ARGO CD</text>
          <rect x="616" y="452" width="36" height="12" rx="2" class="zone-mask"/>
          <text x="634" y="461" text-anchor="middle" class="legend">NFS</text>
        </g>

        <g>
          <rect x="56" y="176" width="184" height="88" rx="6" class="node-focal"/>
          <rect x="68" y="184" width="52" height="12" rx="2" class="tag-box-focal"/>
          <text x="94" y="193" text-anchor="middle" class="tag-focal">GITOPS</text>
          <text x="68" y="220" class="node-name">home-dc-kubernetes</text>
          <text x="68" y="238" class="sublabel">Talos + GitOps source</text>
          <text x="68" y="256" class="sublabel">remote main branch</text>

          <rect x="56" y="360" width="184" height="80" rx="6" class="node"/>
          <rect x="68" y="368" width="48" height="12" rx="2" class="tag-box"/>
          <text x="92" y="377" text-anchor="middle" class="tag">TASKS</text>
          <text x="68" y="404" class="node-name">Talos bootstrap</text>
          <text x="68" y="422" class="sublabel">fresh app cluster only</text>

          <rect x="312" y="176" width="256" height="80" rx="6" class="node"/>
          <rect x="324" y="184" width="76" height="12" rx="2" class="tag-box"/>
          <text x="362" y="193" text-anchor="middle" class="tag">CONTROL</text>
          <text x="324" y="220" class="node-name">Argo CD hub</text>
          <text x="324" y="238" class="sublabel">runs on app-cluster</text>
          <text x="324" y="254" class="sublabel">reconciles both clusters</text>

          <rect x="312" y="344" width="256" height="112" rx="6" class="node-focal"/>
          <rect x="324" y="352" width="72" height="12" rx="2" class="tag-box-focal"/>
          <text x="360" y="361" text-anchor="middle" class="tag-focal">TALOS · APP</text>
          <text x="324" y="388" class="node-name">app-cluster</text>
          <text x="324" y="408" class="sublabel">1 controller · 3 workers</text>
          <text x="324" y="426" class="sublabel">Proxmox VMs · OpenTofu-owned</text>
          <text x="324" y="444" class="sublabel">ExternalDNS · sync gated</text>

          <rect x="648" y="176" width="248" height="80" rx="6" class="node-external"/>
          <rect x="660" y="184" width="56" height="12" rx="2" class="tag-box"/>
          <text x="688" y="193" text-anchor="middle" class="tag">EDGE</text>
          <text x="660" y="220" class="node-name">Cloudflare Tunnels</text>
          <text x="660" y="238" class="sublabel">Terraform-owned · app + infra gateways</text>
          <text x="660" y="254" class="sublabel">app DNS records via ExternalDNS</text>

          <rect x="648" y="344" width="248" height="112" rx="6" class="node"/>
          <rect x="660" y="352" width="92" height="12" rx="2" class="tag-box"/>
          <text x="706" y="361" text-anchor="middle" class="tag">TALOS · INFRA</text>
          <text x="660" y="388" class="node-name">infra-cluster</text>
          <text x="660" y="408" class="sublabel">2 physical Talos nodes</text>
          <text x="660" y="426" class="sublabel">Technitium DNS · 10.0.40.53</text>
          <text x="660" y="444" class="sublabel">managed by app-cluster Argo CD</text>

          <rect x="648" y="472" width="248" height="48" rx="6" class="node-external"/>
          <text x="660" y="492" class="node-name">NAS · 10.0.40.2</text>
          <text x="660" y="510" class="sublabel">media NFS dependency</text>
        </g>

        <g>
          <path d="M56 560 H84" class="control" marker-end="url(#kubernetes-architecture-arrow)"/>
          <text x="96" y="563" class="legend">SOURCE / CONTROL</text>
          <path d="M280 560 H308" class="service" marker-end="url(#kubernetes-architecture-arrow-link)"/>
          <text x="320" y="563" class="legend">TUNNEL / DATA DEPENDENCY</text>
        </g>
      </svg>
