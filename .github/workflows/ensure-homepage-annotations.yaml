---
name: Ensure Homepage Annotations

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "kubernetes/**/*.yaml"
      - "kubernetes/**/*.yml"
      - "scripts/ensure-homepage-annotations.py"
      - ".github/workflows/ensure-homepage-annotations.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-annotations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  annotate:
    name: Add missing homepage annotations
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Ensure homepage annotations
        run: python scripts/ensure-homepage-annotations.py

      - name: Commit annotation changes
        run: |
          if git diff --quiet; then
            echo "All HTTPRoutes already have the expected homepage annotations."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(homepage): ensure HTTPRoute homepage annotations"
          git push
