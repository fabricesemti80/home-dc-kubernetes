---
name: CI Code Quality & Repository Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-lint-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: Lint & Validate Repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Task
        env:
          TASK_VERSION: v3.48.0
        run: |
          wget --quiet "https://github.com/go-task/task/releases/download/${TASK_VERSION}/task_linux_amd64.tar.gz"
          tar -xzf task_linux_amd64.tar.gz
          sudo mv task /usr/local/bin/task
          task --version

      - name: Install Go yq
        env:
          YQ_VERSION: v4.45.4
        run: |
          sudo wget --quiet \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linting Tools
        run: |
          python -m pip install pre-commit
          sudo apt-get update -qq
          sudo apt-get install -y -qq shfmt shellcheck

      - name: Run Linters (pre-commit)
        run: pre-commit run --all-files

      - name: Run Repository Validation (task validate)
        run: task validate
