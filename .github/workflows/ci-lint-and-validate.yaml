---
name: CI Code Quality & Repository Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-lint-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: Lint & Validate Repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Go yq
        env:
          YQ_VERSION: v4.45.4
        run: |
          sudo wget --quiet \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install Linting Tools
        run: |
          python -m pip install pre-commit
          sudo apt-get update -qq
          sudo apt-get install -y -qq shfmt shellcheck

      - name: Run Linters (pre-commit)
        run: pre-commit run --all-files

      - name: Run Repository Validation
        run: bash scripts/validate.sh
