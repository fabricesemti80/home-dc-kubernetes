---
name: Generate AutoKuma Monitors

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "kubernetes/**/*.yaml"
      - "kubernetes/**/*.yml"
      - "scripts/generate-autokuma-monitors.py"
      - ".github/workflows/generate-autokuma-monitors.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autokuma-monitors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Regenerate monitor inventory
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Generate AutoKuma monitors
        run: python scripts/generate-autokuma-monitors.py

      - name: Commit generated inventory
        run: |
          output="kubernetes/apps/monitoring/uptime-kuma-infra/config/autokuma-monitors.yaml"

          if git diff --quiet -- "$output"; then
            echo "AutoKuma monitor inventory is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$output"
          git commit -m "chore(monitoring): regenerate AutoKuma monitors"
          git push
