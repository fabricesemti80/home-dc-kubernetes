---
name: Generate AutoKuma Monitors

on:
  push:
    branches: [main]
    paths:
      - "kubernetes/**/*.yaml"
      - "kubernetes/**/*.yml"
      - "scripts/generate-autokuma-monitors.py"
      - ".github/workflows/generate-autokuma-monitors.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autokuma-monitors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Regenerate monitor inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install yq
        env:
          YQ_VERSION: v4.45.4
        run: |
          sudo wget --quiet \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Generate AutoKuma monitors
        run: python scripts/generate-autokuma-monitors.py

      - name: Commit generated inventory
        run: |
          output="kubernetes/apps/infra-cluster/monitoring/uptime-kuma-infra/config/autokuma-monitors.yaml"

          if git diff --quiet -- "$output"; then
            echo "AutoKuma monitor inventory is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$output"
          git commit -m "chore(monitoring): regenerate AutoKuma monitors"
          git push
